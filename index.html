<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f0f0f; --card-bg: #1a1a1a; --gold: #D4AF37; --green: #25D366; --text: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-bottom: 80px; padding-top: 70px; }

        /* Header */
        header { 
            background: #111; border-bottom: 1px solid #333;
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 9999;
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
        }
        .logo { height: 45px; border: 1px solid var(--gold); border-radius: 5px; }
        
        .nav-btn {
            background: none; border: none; color: #888; font-weight: bold; font-size: 1rem;
            margin-left: 10px; cursor: pointer; padding: 5px; font-family: 'Cairo';
        }
        .nav-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* الصفحات */
        .page { display: none; }
        .page.active { display: block; }

        /* Hero */
        .hero {
            text-align: center; padding: 40px 10px;
            background: url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg');
            background-size: cover; background-position: center;
            border-bottom: 2px solid var(--gold); margin-bottom: 20px;
        }
        .hero h1 { color: white; font-family: 'Oswald'; font-size: 2.5rem; text-shadow: 0 0 10px black; }
        .hero button {
            background: var(--gold); border: none; padding: 10px 30px; font-weight: bold; font-size: 1.1rem;
            border-radius: 30px; cursor: pointer; margin-top: 10px;
        }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: var(--card-bg); border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        
        .img-area { position: relative; padding-top: 125%; }
        .img-area img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .details { padding: 10px; text-align: center; }
        .p-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 900; font-size: 1.1rem; }
        .old-price { text-decoration: line-through; color: #666; font-size: 0.8rem; margin-right: 5px; }
        
        .buy-btn {
            width: 100%; background: var(--green); color: white; border: none; padding: 8px;
            margin-top: 5px; border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black;
            z-index: 10000; display: none; flex-direction: column; overflow-y: auto;
        }
        .modal-head { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #222; }
        .modal-content { padding: 20px; text-align: center; }
        .main-img { width: 100%; height: 400px; object-fit: contain; border: 1px solid #333; margin-bottom: 10px; }
        
        .action-btn {
            width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
        }
        .whatsapp { background: var(--green); color: white; }
        .call { background: #007bff; color: white; }
        .cancel { background: transparent; border: 1px solid #555; color: #ccc; }

        .inp { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; margin-bottom: 10px; border-radius: 5px; }

    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center;">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo">
            <span style="color: var(--gold); font-weight: bold; margin-right: 10px; font-family: 'Oswald'; font-size: 1.2rem;">DISHA</span>
        </div>
        <div>
            <button class="nav-btn active" onclick="goPage('home')" id="btn-home">الرئيسية</button>
            <button class="nav-btn" onclick="goPage('hoodies')" id="btn-hoodies">هوديز</button>
            <button class="nav-btn" onclick="goPage('pants')" id="btn-pants">بناطيل</button>
        </div>
    </header>

    <div id="home" class="page active">
        <div class="hero">
            <h1>STREETWEAR 2026</h1>
            <button onclick="goPage('hoodies')">تسوق الكولكشن</button>
        </div>
        <h3 style="text-align: center; color: var(--gold); margin: 20px 0;">أقوى العروض (Best Sellers) 🔥</h3>
        <div class="grid" id="home-grid"></div>
    </div>

    <div id="hoodies" class="page">
        <h3 style="text-align: center; color: var(--gold); margin: 20px 0;">قسم الهوديز</h3>
        <div class="grid" id="hoodies-grid"></div>
    </div>

    <div id="pants" class="page">
        <h3 style="text-align: center; color: var(--gold); margin: 20px 0;">قسم البناطيل</h3>
        <div class="grid" id="pants-grid"></div>
    </div>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <h3 style="color: var(--gold);" id="vName">اسم المنتج</h3>
            <button onclick="closeViewer()" style="background: none; border: none; color: white; font-size: 1.5rem;">✕</button>
        </div>
        <div class="modal-content">
            <img src="" id="vImg" class="main-img" onclick="toggleZoom(this)">
            <p style="color: #666; font-size: 0.8rem;">اضغط على الصورة للتكبير</p>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                <button onclick="changeSide('f')" style="padding: 5px 20px; background: #333; color: white; border: 1px solid #555; border-radius: 20px;">الوش</button>
                <button onclick="changeSide('b')" style="padding: 5px 20px; background: #333; color: white; border: 1px solid #555; border-radius: 20px;">الضهر</button>
            </div>

            <h2 style="color: var(--gold); margin-bottom: 10px;" id="vPrice">000</h2>
            <button class="action-btn whatsapp" onclick="showOrderForm()">اشترِ الآن</button>
        </div>
    </div>

    <div id="orderForm" class="modal" style="background: rgba(0,0,0,0.9); justify-content: center;">
        <div style="background: #222; padding: 20px; width: 90%; max-width: 350px; border: 1px solid var(--gold); border-radius: 10px; margin: auto;">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 15px;">بيانات الشحن</h3>
            <input type="text" id="cName" class="inp" placeholder="الاسم ثلاثي">
            <input type="text" id="cGov" class="inp" placeholder="المحافظة">
            <input type="text" id="cAddr" class="inp" placeholder="العنوان بالتفصيل">
            
            <button class="action-btn whatsapp" onclick="sendWhatsapp()">تأكيد واتساب</button>
            <button class="action-btn call" onclick="window.open('tel:01117943368')">اتصال هاتفي</button>
            <button class="action-btn cancel" onclick="document.getElementById('orderForm').style.display='none'">إلغاء</button>
        </div>
    </div>

    <script>
        // الداتا
        const products = [
            // الهوديز
            {id:1, type:'top', name:'هودي أسود Preface', price:650, old:800, f:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg', b:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg'},
            {id:2, type:'top', name:'هودي أبيض Dope Shine', price:600, old:750, f:'https://i.postimg.cc/Xv0Xy5Qj/1000012716.jpg', b:'https://i.postimg.cc/GmR2gq4P/1000012717.jpg'},
            {id:3, type:'top', name:'هودي أسود Eye & Hand', price:600, old:750, f:'https://i.postimg.cc/HWQ7xW1L/1000012695.jpg', b:'https://i.postimg.cc/qRJ1zL9z/1000012696.jpg'},
            {id:4, type:'top', name:'هودي أبيض Preface', price:650, old:800, f:'https://i.postimg.cc/7Zh0V1P2/1000012701.jpg', b:'https://i.postimg.cc/7Zh0V1P2/1000012701.jpg'},
            {id:5, type:'top', name:'هودي بني Preface', price:650, old:800, f:'https://i.postimg.cc/CLj6bZzL/1000012702.jpg', b:'https://i.postimg.cc/CLj6bZzL/1000012702.jpg'},
            {id:6, type:'top', name:'هودي أبيض Angel', price:600, old:750, f:'https://i.postimg.cc/Qd1n4yqR/1000012698.jpg', b:'https://i.postimg.cc/Prh5xWqL/1000012697.jpg'},
            {id:7, type:'top', name:'هودي أسود Skull', price:600, old:750, f:'https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg', b:'https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'},
            {id:8, type:'top', name:'هودي أوف وايت Graphic', price:600, old:750, f:'https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg', b:'https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg'},
            {id:9, type:'top', name:'هودي رصاصي طباعة', price:600, old:750, f:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg', b:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg'},
            {id:10, type:'top', name:'ترنج كامل أسود', price:900, old:1000, f:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg', b:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg'},
            
            // البناطيل
            {id:11, type:'bottom', name:'بنطلون جينز Light Blue', price:600, old:750, f:'https://i.postimg.cc/zByvgp1V/IMG_20260210_WA0023.jpg', b:'https://i.postimg.cc/j5D27vrD/IMG-20260210-WA0022.jpg'},
            {id:12, type:'bottom', name:'بنطلون جينز Mod 1', price:600, old:750, f:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg', b:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg'},
            {id:13, type:'bottom', name:'بنطلون جينز Mod 2', price:600, old:750, f:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg', b:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg'},
            {id:14, type:'bottom', name:'بنطلون جينز Mod 3', price:600, old:750, f:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg', b:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg'},
            {id:15, type:'bottom', name:'بنطلون جينز Mod 4', price:600, old:750, f:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg', b:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg'},
            {id:16, type:'bottom', name:'بنطلون جينز Mod 5', price:600, old:750, f:'https://i.postimg.cc/XJb1Z15q/IMG_20260211_WA0004.jpg', b:'https://i.postimg.cc/Kz2pKpTR/IMG_20260211_WA0005.jpg'}
        ];

        let currentP = null;

        // تشغيل الموقع
        window.onload = function() {
            // 1. الرئيسية: اخترنا 4 منتجات (هودي أسود، أبيض، بنطلون، ترنج)
            render(products.filter(p => [1, 2, 11, 10].includes(p.id)), 'home-grid');
            
            // 2. الهوديز
            render(products.filter(p => p.type === 'top'), 'hoodies-grid');
            
            // 3. البناطيل
            render(products.filter(p => p.type === 'bottom'), 'pants-grid');
        };

        function render(list, id) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            list.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <div class="img-area" onclick="openViewer(${p.id})">
                            <img src="${p.f}">
                        </div>
                        <div class="details">
                            <div class="p-title">${p.name}</div>
                            <div><span class="price">${p.price} ج.م</span> <span class="old-price">${p.old}</span></div>
                            <button class="buy-btn" onclick="openViewer(${p.id})">التفاصيل</button>
                        </div>
                    </div>
                `;
            });
        }

        // التنقل
        function goPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        // العرض
        function openViewer(id) {
            currentP = products.find(p => p.id === id);
            document.getElementById('vName').innerText = currentP.name;
            document.getElementById('vPrice').innerText = currentP.price + " ج.م";
            document.getElementById('vImg').src = currentP.f;
            document.getElementById('viewer').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
        }

        function changeSide(side) {
            document.getElementById('vImg').src = (side === 'f') ? currentP.f : currentP.b;
        }

        function toggleZoom(img) {
            if(img.style.transform === 'scale(2)') {
                img.style.transform = 'scale(1)';
                img.style.cursor = 'zoom-in';
            } else {
                img.style.transform = 'scale(2)';
                img.style.cursor = 'zoom-out';
            }
        }

        // الطلب
        function showOrderForm() {
            closeViewer();
            document.getElementById('orderForm').style.display = 'flex';
        }

        function sendWhatsapp() {
            const n = document.getElementById('cName').value;
            const g = document.getElementById('cGov').value;
            const a = document.getElementById('cAddr').value;
            
            if(!n || !g || !a) { alert('اكتب البيانات كاملة'); return; }
            
            const txt = `طلب جديد: ${currentP.name}%0aالسعر: ${currentP.price}%0aالعميل: ${n}%0aالعنوان: ${g} - ${a}`;
            window.open(`https://wa.me/201284381589?text=${txt}`, '_blank');
            document.getElementById('orderForm').style.display = 'none';
        }
    </script>
</body>
</html>
