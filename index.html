<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISHA BRAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --primary: #D4AF37; /* دهبي */
            --green: #25D366;   /* أخضر الواتس */
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

        /* --- Header --- */
        header {
            background: rgba(18, 18, 18, 0.95);
            padding: 15px;
            position: fixed;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 40px; border-radius: 50%; border: 1px solid var(--primary); }
        .brand-name { font-weight: 900; color: var(--primary); letter-spacing: 1px; }

        /* --- Products Grid --- */
        .container { padding: 80px 10px 20px 10px; max-width: 1200px; margin: 0 auto; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* عمودين للموبايل */
            gap: 10px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
        }

        /* --- Card Design --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .img-box {
            position: relative;
            width: 100%;
            padding-top: 125%; /* نسبة طول للصورة */
            overflow: hidden;
            cursor: pointer;
        }

        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .details { padding: 10px; text-align: center; }
        
        .p-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .price-box { margin-bottom: 8px; }
        .curr-price { color: var(--primary); font-weight: 900; font-size: 1.1rem; }
        .old-price { color: #777; font-size: 0.8rem; text-decoration: line-through; margin-right: 5px; }

        .btn-green {
            background: var(--green);
            color: white;
            border: none;
            padding: 8px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        /* --- Product Viewer Modal (التحديث الجديد) --- */
        .viewer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .viewer-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
        }

        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        .viewer-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-image-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* كلاس الزوم */
        .zoomed { transform: scale(2); cursor: zoom-out; }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        
        .control-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .control-btn.active { border-color: var(--primary); color: var(--primary); }

        /* --- Order Form Modal --- */
        .form-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .form-content {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--primary);
        }

        .inp {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: #111; border: 1px solid #444;
            color: white; border-radius: 8px;
        }

        .footer {
            text-align: center; padding: 20px; font-size: 0.8rem; color: #777;
            position: fixed; bottom: 0; width: 100%; background: #121212;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img">
            <span class="brand-name">DISHA BRAND</span>
        </div>
        <i class="fas fa-shopping-bag" style="color: white; font-size: 1.2rem;"></i>
    </header>

    <div class="container">
        <div class="grid" id="productsGrid">
            </div>
    </div>

    <div class="viewer-overlay" id="productViewer">
        <div class="viewer-header">
            <h3 id="viewName">اسم المنتج</h3>
            <button class="close-btn" onclick="closeViewer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="viewer-body">
            <div class="main-image-container" onclick="toggleZoom()">
                <img src="" id="viewImage" class="main-image">
            </div>
            <p style="color: #777; font-size: 0.8rem; margin-bottom: 10px;">اضغط على الصورة للتكبير (Zoom)</p>
            
            <div class="controls">
                <button class="control-btn active" onclick="switchView('front')">الوش</button>
                <button class="control-btn" onclick="switchView('back')">الضهر</button>
            </div>

            <div class="price-box">
                <span class="curr-price" id="viewPrice" style="font-size: 1.5rem;"></span>
            </div>

            <button class="btn-green" style="padding: 15px; font-size: 1.1rem;" onclick="openFormFromViewer()">
                <i class="fab fa-whatsapp"></i> اطلب الآن
            </button>
        </div>
    </div>

    <div class="form-modal" id="orderForm">
        <div class="form-content">
            <h3 style="color: var(--primary); text-align: center; margin-bottom: 20px;">بيانات الشحن</h3>
            <input type="text" id="cName" class="inp" placeholder="الاسم بالكامل">
            <select id="cGov" class="inp" onchange="loadCities()">
                <option value="">اختر المحافظة...</option>
            </select>
            <select id="cCity" class="inp" disabled>
                <option value="">اختر المدينة...</option>
            </select>
            <input type="text" id="cAddress" class="inp" placeholder="العنوان بالتفصيل (الشارع / رقم البيت)">
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-green" onclick="sendOrder()">إرسال الطلب</button>
                <button class="btn-green" style="background: transparent; border: 1px solid #555;" onclick="closeForm()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="footer">
        Created by <a href="https://wa.me/201128381838" style="color: var(--primary); text-decoration: none;">Ahmed Mohamed</a>
    </div>

    <script>
        // --- البيانات ---
        const products = [
            { id: 1, name: "هودي أسود (Black Skull)", price: 600, old: 750, front: "https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg", back: "https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg" },
            { id: 2, name: "هودي أوف وايت (Graphic)", price: 600, old: 750, front: "https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg", back: "https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg" },
            { id: 3, name: "هودي رصاصي طباعة", price: 600, old: 700, front: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg", back: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg" },
            { id: 4, name: "سويت شيرت بيسك (أسود)", price: 650, old: 800, front: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg", back: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg" },
            { id: 5, name: "سويت شيرت بيسك (رصاصي)", price: 650, old: 800, front: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg", back: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg" },
            { id: 6, name: "سويت شيرت بيسك (أوف وايت)", price: 650, old: 800, front: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg", back: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg" },
            { id: 7, name: "سويت شيرت بريميم (أسود)", price: 800, old: 1000, front: "https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg", back: "https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg" },
            { id: 8, name: "سويت شيرت بريميم (هافان)", price: 800, old: 1000, front: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg", back: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg" },
            { id: 9, name: "ترنج كامل (أسود)", price: 900, old: 1000, front: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg", back: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg" },
            { id: 10, name: "ترنج كامل (رصاصي)", price: 900, old: 1000, front: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg", back: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg" },
            { id: 11, name: "سويت شيرت هاي إند (أسود)", price: 1300, old: 1500, front: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg", back: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg" },
            { id: 12, name: "سويت شيرت هاي إند (بيج)", price: 1300, old: 1500, front: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg", back: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg" },
            { id: 13, name: "بنطلون كارجو/جينز", price: 700, old: 800, front: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg", back: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg" }
        ];

        const egyptData = {
            "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع الخامس", "شبرا", "وسط البلد", "حلوان", "المرج", "عين شمس"],
            "الجيزة": ["الدقي", "المهندسين", "الهرم", "فيصل", "6 أكتوبر", "الشيخ زايد", "إمبابة", "الوراق"],
            "الإسكندرية": ["سموحة", "ميامي", "المنتزه", "العجمي", "سيدي جابر", "محطة الرمل"],
            "القليوبية": ["بنها", "شبرا الخيمة", "قليوب", "العبور"],
            "الدقهلية": ["المنصورة", "ميت غمر"],
            "الشرقية": ["الزقازيق", "العشر من رمضان"],
            "الغربية": ["طنطا", "المحلة الكبرى"],
            "المنوفية": ["شبين الكوم", "السادات"],
            "البحيرة": ["دمنهور", "كفر الدوار"],
            "بورسعيد": ["بورسعيد", "بورفؤاد"],
            "السويس": ["السويس"],
            "الإسماعيلية": ["الإسماعيلية"],
            "كفر الشيخ": ["كفر الشيخ", "دسوق"],
            "دمياط": ["دمياط", "رأس البر"],
            "بني سويف": ["بني سويف"],
            "المنيا": ["المنيا"],
            "أسيوط": ["أسيوط"],
            "سوهاج": ["سوهاج"],
            "قنا": ["قنا"],
            "الأقصر": ["الأقصر"],
            "أسوان": ["أسوان"]
        };

        // --- عرض المنتجات ---
        const grid = document.getElementById('productsGrid');
        
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-box" onclick="openViewer(${p.id})">
                    <img src="${p.front}" class="card-img" alt="${p.name}">
                </div>
                <div class="details">
                    <div class="p-name">${p.name}</div>
                    <div class="price-box">
                        <span class="curr-price">${p.price} ج.م</span>
                        <span class="old-price">${p.old}</span>
                    </div>
                    <button class="btn-green" onclick="openViewer(${p.id})">
                        <i class="fas fa-cart-plus"></i> اطلب الآن
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- منطق عارض الصور (Viewer) ---
        let currentP = null;
        let isFront = true;

        function openViewer(id) {
            currentP = products.find(p => p.id === id);
            if(!currentP) return;

            document.getElementById('viewName').innerText = currentP.name;
            document.getElementById('viewPrice').innerText = currentP.price + " ج.م";
            document.getElementById('productViewer').style.display = 'flex';
            
            // إعادة تعيين الحالة
            isFront = true;
            resetZoom();
            updateViewImage();
        }

        function closeViewer() {
            document.getElementById('productViewer').style.display = 'none';
        }

        function switchView(side) {
            isFront = (side === 'front');
            updateViewImage();
            // تحديث ستايل الزراير
            const btns = document.querySelectorAll('.control-btn');
            btns[0].classList.toggle('active', isFront);
            btns[1].classList.toggle('active', !isFront);
        }

        function updateViewImage() {
            const img = document.getElementById('viewImage');
            img.src = isFront ? currentP.front : currentP.back;
        }

        function toggleZoom() {
            const img = document.getElementById('viewImage');
            img.classList.toggle('zoomed');
        }
        
        function resetZoom() {
            document.getElementById('viewImage').classList.remove('zoomed');
        }

        // --- منطق فورم الطلب ---
        function openFormFromViewer() {
            closeViewer(); // نقفل العارض
            document.getElementById('orderForm').style.display = 'flex'; // نفتح الفورم
            
            // تحميل المحافظات
            const govSel = document.getElementById('cGov');
            if (govSel.options.length === 1) { // لو فاضية بس
                for (let g in egyptData) {
                    let op = document.createElement('option');
                    op.value = g; op.innerText = g;
                    govSel.appendChild(op);
                }
            }
        }

        function closeForm() {
            document.getElementById('orderForm').style.display = 'none';
        }

        function loadCities() {
            const gov = document.getElementById('cGov').value;
            const citySel = document.getElementById('cCity');
            citySel.innerHTML = '<option value="">اختر المدينة...</option>';
            
            if (gov && egyptData[gov]) {
                citySel.disabled = false;
                egyptData[gov].forEach(c => {
                    let op = document.createElement('option');
                    op.value = c; op.innerText = c;
                    citySel.appendChild(op);
                });
            } else {
                citySel.disabled = true;
            }
        }

        function sendOrder() {
            const name = document.getElementById('cName').value;
            const gov = document.getElementById('cGov').value;
            const city = document.getElementById('cCity').value;
            const addr = document.getElementById('cAddress').value;

            if(!name || !gov || !city || !addr) {
                alert('من فضلك أكمل البيانات');
                return;
            }

            const msg = `طلب جديد: ${currentP.name}%0aالسعر: ${currentP.price} جنيه%0a-- بيانات الشحن --%0aالاسم: ${name}%0aالعنوان: ${gov} - ${city} - ${addr}`;
            window.open(`https://wa.me/201284381589?text=${msg}`, '_blank');
            closeForm();
        }
    </script>
</body>
</html>
