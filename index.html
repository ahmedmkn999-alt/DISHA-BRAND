<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://pl28692420.effectivegatecpm.com/0f/62/cc/0f62cc9ba1a0f4918384261a49a38e8f.js"></script>

    <style>
        /* --- التصميم (Luxury Dark Theme) --- */
        :root { --bg: #000; --card: #111; --gold: #D4AF37; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-top: 60px; padding-bottom: 50px; }

        /* الهيدر */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--gold);
            z-index: 9999; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
        }
        .logo-area { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .logo-img { height: 35px; border: 1px solid var(--gold); border-radius: 5px; }
        .brand { font-family: 'Oswald'; color: var(--gold); font-size: 1.2rem; font-weight: bold; display: none; }
        @media (min-width: 350px) { .brand { display: block; } }

        .nav-links { display: flex; gap: 5px; }
        .nav-btn { 
            background: none; border: 1px solid #333; color: #ccc; font-weight: bold; font-size: 0.8rem; 
            cursor: pointer; padding: 5px 8px; border-radius: 5px; transition: 0.3s;
        }
        .nav-btn.active { background: var(--gold); color: black; border-color: var(--gold); }

        /* منطقة الفيديو */
        .hero {
            position: relative; height: 40vh; width: 100%; overflow: hidden; border-bottom: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; 
        }
        .video-bg iframe {
            width: 300%; height: 150%; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0.6; pointer-events: none;
        }
        .hero-content {
            position: relative; z-index: 10; text-align: center; width: 100%; pointer-events: none;
        }
        .hero-content h1 { font-family: 'Oswald'; font-size: 3rem; margin: 0; text-shadow: 0 5px 15px black; line-height: 1; color: white; }
        .hero-content h2 { color: var(--gold); font-family: 'Oswald'; font-size: 1.8rem; margin: 0; text-shadow: 0 5px 10px black; }
        
        .hero-btn {
            background: var(--gold); color: #000; border: none;
            padding: 10px 30px; font-size: 1rem; font-weight: bold;
            border-radius: 50px; margin-top: 15px; cursor: pointer;
            box-shadow: 0 0 20px rgba(212,175,55,0.5); pointer-events: auto;
        }

        /* المنتجات */
        .section-title { padding: 10px 15px; color: var(--gold); font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--gold); margin: 20px 0; background: linear-gradient(90deg, #111, transparent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; min-height: 200px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; animation: fadeIn 0.5s; }
        
        .img-box { position: relative; padding-top: 125%; background: #222; overflow: hidden; }
        .img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; z-index: 2; }
        
        .info { padding: 8px; text-align: center; }
        .p-name { font-size: 0.8rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; font-weight: bold; }
        .price { color: var(--gold); font-weight: 900; font-size: 0.95rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.75rem; margin-right: 5px; }
        
        .btn-details {
            width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 5px; margin-top: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }

        /* حالة التحميل */
        .loader { text-align: center; width: 200%; color: #777; margin-top: 20px; font-size: 0.9rem; }

        /* الصفحات والمودال */
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; display: none; flex-direction: column; }
        .modal-head { padding: 15px; display: flex; justify-content: space-between; background: #111; border-bottom: 1px solid #333; }
        .modal-body { padding: 20px; text-align: center; }
        .big-img { width: 100%; height: 400px; object-fit: contain; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 15px; }
        
        .ctrl-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .sw-btn { padding: 8px 25px; background: #222; color: white; border: 1px solid #444; border-radius: 20px; cursor: pointer; }
        .sw-btn.active { border-color: var(--gold); color: var(--gold); }

        .btn-buy { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        .inp { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #555; color: white; border-radius: 5px; text-align: right; }
        select.inp { background: #222; }

        footer { background: #000; padding: 20px; text-align: center; border-top: 1px solid #333; margin-top: 30px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="window.go('home')">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img">
            <span class="brand">DISHA</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="b-home" onclick="window.go('home')">الرئيسية</button>
            <button class="nav-btn" id="b-hoodies" onclick="window.go('hoodies')">هوديز</button>
            <button class="nav-btn" id="b-pants" onclick="window.go('pants')">بناطيل</button>
            <button class="nav-btn" id="b-tracks" onclick="window.go('tracks')">ترنجات</button>
        </div>
    </header>

    <div id="home" class="page active">
        <div class="hero">
            <div class="video-bg">
                <iframe src="https://www.youtube.com/embed/7ldPYcZ-oaU?autoplay=1&mute=1&controls=0&loop=1&playlist=7ldPYcZ-oaU&playsinline=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="hero-content">
                <h1>STREETWEAR</h1>
                <h2>2026</h2>
                <button class="hero-btn" onclick="window.go('hoodies')">تسوق الآن</button>
            </div>
        </div>
        
        <div class="section-title">أحدث المنتجات 🔥</div>
        <div class="grid" id="grid-home">
            <p class="loader">جاري تحميل المنتجات...</p>
        </div>
        <footer><p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p></footer>
    </div>

    <div id="hoodies" class="page"><div class="section-title">قسم الهوديز</div><div class="grid" id="grid-hoodies"><p class="loader">جاري التحميل...</p></div></div>
    <div id="pants" class="page"><div class="section-title">قسم البناطيل</div><div class="grid" id="grid-pants"><p class="loader">جاري التحميل...</p></div></div>
    <div id="tracks" class="page"><div class="section-title">قسم الترنجات</div><div class="grid" id="grid-tracks"><p class="loader">جاري التحميل...</p></div></div>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <span style="color:var(--gold); font-weight:bold;" id="vName"></span>
            <span style="color:white; font-size:1.5rem; cursor:pointer;" onclick="window.closeM('viewer')">✕</span>
        </div>
        <div class="modal-body">
            <img src="" id="vImg" class="big-img" onerror="this.src='https://placehold.co/400x400/222/D4AF37?text=DISHA'">
            <div id="btns-sw" class="ctrl-btns">
                <button class="sw-btn active" id="btn-f" onclick="window.swImg('f')">الوش</button>
                <button class="sw-btn" id="btn-b" onclick="window.swImg('b')">الضهر</button>
            </div>
            <h2 style="color:var(--gold); margin-bottom:5px;" id="vPrice"></h2>
            <span style="color:#777; text-decoration:line-through;" id="vOld"></span>
            <button class="btn-buy" onclick="window.openForm()">اطلب الآن (واتساب)</button>
        </div>
    </div>

    <div id="form" class="modal" style="justify-content:center;">
        <div style="background:#151515; padding:20px; width:90%; border:1px solid var(--gold); border-radius:10px; margin:auto;">
            <h3 style="color:var(--gold); text-align:center;">بيانات الشحن</h3>
            <input id="fName" class="inp" type="text" placeholder="الاسم">
            <select id="fGov" class="inp" onchange="window.loadCity()"><option value="">اختر المحافظة...</option></select>
            <select id="fCity" class="inp" disabled><option value="">اختر المدينة...</option></select>
            <input id="fAddr" class="inp" type="text" placeholder="العنوان">
            <button class="btn-buy" onclick="window.sendWa()">تأكيد الطلب</button>
            <button onclick="window.closeM('form')" style="width:100%; padding:10px; background:transparent; border:1px solid #555; color:#ccc; margin-top:10px; border-radius:5px;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        // 🔥 استيراد مكتبات فايربيس (v9)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // 🔥 تهيئة المشروع (بالبيانات اللي أنت بعتها)
        const firebaseConfig = {
            apiKey: "AIzaSyAQuVtULU8APTurAmlkQ9gNyFG_N1Jvq48",
            authDomain: "disha-brand.firebaseapp.com",
            projectId: "disha-brand",
            storageBucket: "disha-brand.firebasestorage.app",
            messagingSenderId: "170505241014",
            appId: "1:170505241014:web:b3cbea5dcb06624e93c117",
            measurementId: "G-XL3C1JY6MF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // متغيرات عامة
        let allProducts = [];
        let curr = null;
        const govs = { "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي"], "الجيزة": ["الهرم", "فيصل", "6 أكتوبر"], "الإسكندرية": ["سموحة", "ميامي"], "باقي المحافظات": ["أخرى"] };

        // 1. جلب المنتجات من قاعدة البيانات
        async function fetchProducts() {
            try {
                // ترتيب حسب التاريخ (الأحدث أولاً)
                const q = query(collection(db, "products"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                
                allProducts = [];
                querySnapshot.forEach((doc) => {
                    let d = doc.data();
                    d.id = doc.id;
                    allProducts.push(d);
                });

                renderAll();
            } catch (error) {
                console.error("Error fetching products:", error);
                document.getElementById('grid-home').innerHTML = '<p style="text-align:center;color:red;">حدث خطأ في التحميل، تأكد من الإنترنت.</p>';
            }
        }

        // 2. عرض المنتجات في الأقسام
        function renderAll() {
            // تحميل المحافظات
            const s = document.getElementById('fGov');
            s.innerHTML = '<option value="">اختر المحافظة...</option>';
            for(let g in govs) { let o = document.createElement('option'); o.value=g; o.innerText=g; s.appendChild(o); }

            // الرئيسية: نعرض أحدث 6 منتجات
            render(allProducts.slice(0, 6), 'grid-home');
            
            // باقي الأقسام
            render(allProducts.filter(i => i.t === 'top'), 'grid-hoodies');
            render(allProducts.filter(i => i.t === 'bottom'), 'grid-pants');
            render(allProducts.filter(i => i.t === 'track'), 'grid-tracks');
        }

        function render(arr, id) {
            const el = document.getElementById(id);
            if(!el) return;
            el.innerHTML = '';
            
            if(arr.length === 0) {
                el.innerHTML = '<p style="text-align:center; width:200%; color:#555; padding:20px;">لا توجد منتجات حالياً ⏳</p>';
                return;
            }

            arr.forEach(i => {
                // التأكد من الصور
                let img = i.f ? i.f : 'https://placehold.co/400x400/222/D4AF37?text=Coming+Soon';
                
                el.innerHTML += `
                <div class="card">
                    <div class="badge">جديد</div>
                    <div class="img-box" onclick="window.show('${i.id}')">
                        <img src="${img}" onerror="this.src='https://placehold.co/400x400/222/D4AF37?text=DISHA'" loading="lazy">
                    </div>
                    <div class="info">
                        <div class="p-name">${i.n}</div>
                        <div><span class="price">${i.p} ج.م</span> <span class="old-price">${i.o ? i.o : ''}</span></div>
                        <button class="btn-details" onclick="window.show('${i.id}')">التفاصيل</button>
                    </div>
                </div>`;
            });
        }

        // --- دوال التحكم (Windows Scope) ---
        window.go = function(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display='none');
            document.getElementById(id).style.display='block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('b-'+id)) document.getElementById('b-'+id).classList.add('active');
            window.scrollTo(0,0);
        }

        window.show = function(id) {
            curr = allProducts.find(x => x.id === id);
            if(!curr) return;

            document.getElementById('vName').innerText = curr.n;
            document.getElementById('vPrice').innerText = curr.p + " ج.م";
            document.getElementById('vOld').innerText = curr.o || "";
            document.getElementById('vImg').src = curr.f;
            
            const btns = document.getElementById('btns-sw');
            // لو مفيش صورة ضهر، أو صورة الضهر هي هي الوش -> نخفي الزراير
            if(!curr.b || curr.f === curr.b) {
                btns.style.display='none';
            } else {
                btns.style.display='flex';
                document.getElementById('btn-f').classList.add('active');
                document.getElementById('btn-b').classList.remove('active');
            }
            document.getElementById('viewer').style.display = 'flex';
        }

        window.closeM = function(id) { document.getElementById(id).style.display='none'; }
        
        window.swImg = function(s) {
            if(!curr) return;
            document.getElementById('vImg').src = (s==='f') ? curr.f : (curr.b || curr.f);
            document.getElementById('btn-f').classList.toggle('active', s==='f');
            document.getElementById('btn-b').classList.toggle('active', s==='b');
        }
        
        window.openForm = function() { window.closeM('viewer'); document.getElementById('form').style.display='flex'; }

        window.loadCity = function() {
            const g = document.getElementById('fGov').value;
            const c = document.getElementById('fCity');
            c.innerHTML = '<option>اختر المدينة...</option>';
            c.disabled = true;
            if(govs[g]) {
                c.disabled = false;
                govs[g].forEach(x => { let o=document.createElement('option'); o.value=x; o.innerText=x; c.appendChild(o); });
            }
        }

        window.sendWa = function() {
            const n=document.getElementById('fName').value;
            const g=document.getElementById('fGov').value;
            const c=document.getElementById('fCity').value;
            const a=document.getElementById('fAddr').value;
            if(!n || !g || !c || !a) { alert('من فضلك أكمل البيانات'); return; }
            const msg = `طلب جديد: ${curr.n}%0aالسعر: ${curr.p}%0aالعميل: ${n}%0aالعنوان: ${g}-${c}-${a}`;
            window.open(`https://wa.me/201284381589?text=${msg}`, '_blank');
        }

        // بدء التشغيل
        fetchProducts();
    </script>
</body>
                </html>
