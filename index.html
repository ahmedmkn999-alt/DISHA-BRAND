<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- الأساسيات --- */
        :root { --bg: #000; --card: #111; --gold: #D4AF37; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-top: 60px; padding-bottom: 50px; }

        /* --- الهيدر --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--gold);
            z-index: 9999; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
        }
        .brand { font-family: 'Oswald'; color: var(--gold); font-size: 1.4rem; font-weight: bold; border: 1px solid var(--gold); padding: 2px 8px; border-radius: 5px; }
        .nav-btn { background: none; border: none; color: #aaa; font-weight: bold; font-size: 0.9rem; margin-left: 5px; cursor: pointer; padding: 5px; }
        .nav-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* --- منطقة الفيديو (الإصلاح الجذري) --- */
        .hero {
            position: relative; height: 40vh; /* ارتفاع مناسب للموبايل */
            width: 100%; overflow: hidden; border-bottom: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        
        /* الفيديو في الخلفية تماماً وغير قابل للمس */
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; /* الحل السحري */
        }
        .video-bg iframe {
            width: 300%; height: 150%; /* تكبير لإخفاء عناصر التحكم */
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0.5; /* تغميق بسيط */
            pointer-events: none; /* تأكيد عدم اللمس */
        }

        /* المحتوى (فوق الفيديو) */
        .hero-content {
            position: relative; z-index: 10; /* طبقة عالية جداً */
            text-align: center; width: 100%;
            pointer-events: none; /* عشان اللمس يعدي للمساحات الفاضية */
        }
        .hero-content h1 { font-family: 'Oswald'; font-size: 3rem; margin: 0; text-shadow: 0 5px 15px black; line-height: 1; }
        .hero-content h2 { color: var(--gold); font-family: 'Oswald'; font-size: 2rem; margin: 0; text-shadow: 0 5px 10px black; }
        
        /* زرار التسوق (تفعيل اللمس عليه مخصوص) */
        .hero-btn {
            background: var(--gold); color: #000; border: none;
            padding: 12px 40px; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; margin-top: 15px; cursor: pointer;
            box-shadow: 0 0 20px rgba(212,175,55,0.5);
            pointer-events: auto; /* تفعيل الزرار */
        }

        /* --- المنتجات --- */
        .section-title { padding: 10px; color: var(--gold); font-size: 1.2rem; font-weight: bold; border-right: 4px solid var(--gold); margin: 20px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        
        .card { background: var(--card); border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        
        /* مكان الصورة */
        .img-box { position: relative; padding-top: 125%; background: #222; }
        .img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 10px; text-align: center; }
        .p-name { font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: bold; font-size: 1rem; }
        
        .btn-details {
            width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 8px; margin-top: 5px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        /* --- الصفحات --- */
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }

        /* --- المودال --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; display: none; flex-direction: column; overflow-y: auto; }
        .modal-head { padding: 15px; display: flex; justify-content: space-between; background: #111; border-bottom: 1px solid #333; }
        .modal-body { padding: 20px; text-align: center; }
        .big-img { width: 100%; height: 400px; object-fit: contain; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 15px; }
        .btn-buy { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        
        /* فورم الطلب */
        .inp { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #555; color: white; border-radius: 5px; text-align: right; }
        select.inp { background: #222; }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="go('home')">DISHA</div>
        <nav>
            <button class="nav-btn active" id="b-home" onclick="go('home')">الرئيسية</button>
            <button class="nav-btn" id="b-hoodies" onclick="go('hoodies')">هوديز</button>
            <button class="nav-btn" id="b-pants" onclick="go('pants')">بناطيل</button>
        </nav>
    </header>

    <div id="home" class="page active">
        <div class="hero">
            <div class="video-bg">
                <iframe src="https://www.youtube.com/embed/7ldPYcZ-oaU?autoplay=1&mute=1&controls=0&loop=1&playlist=7ldPYcZ-oaU&playsinline=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="hero-content">
                <h1>STREETWEAR</h1>
                <h2>2026</h2>
                <button class="hero-btn" onclick="go('hoodies')">تسوق الآن</button>
            </div>
        </div>
        <div class="section-title">الأكثر مبيعاً 🔥</div>
        <div class="grid" id="grid-home"></div>
    </div>

    <div id="hoodies" class="page">
        <div class="section-title" style="margin-top: 20px;">قسم الهوديز</div>
        <div class="grid" id="grid-hoodies"></div>
    </div>

    <div id="pants" class="page">
        <div class="section-title" style="margin-top: 20px;">قسم البناطيل</div>
        <div class="grid" id="grid-pants"></div>
    </div>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <span style="color:var(--gold); font-weight:bold; font-size:1.1rem" id="vName">اسم المنتج</span>
            <span style="color:white; font-size:1.5rem; cursor:pointer;" onclick="closeM('viewer')">✕</span>
        </div>
        <div class="modal-body">
            <img src="" id="vImg" class="big-img" onerror="this.src='https://placehold.co/400x400/111/D4AF37?text=DISHA'">
            
            <div id="btns-sw" style="display:flex; gap:10px; justify-content:center; margin-bottom:15px;">
                <button onclick="swImg('f')" style="padding:10px 20px; background:#333; color:white; border:none; border-radius:5px;">الوش</button>
                <button onclick="swImg('b')" style="padding:10px 20px; background:#333; color:white; border:none; border-radius:5px;">الضهر</button>
            </div>

            <h2 style="color:var(--gold); margin-bottom:10px;" id="vPrice">000</h2>
            <button class="btn-buy" onclick="openForm()">اطلب الآن (واتساب)</button>
        </div>
    </div>

    <div id="form" class="modal" style="justify-content:center;">
        <div style="background:#151515; padding:20px; width:90%; max-width:400px; border:1px solid var(--gold); border-radius:10px; margin:auto;">
            <h3 style="color:var(--gold); text-align:center; margin-bottom:20px;">بيانات الشحن</h3>
            <input id="fName" class="inp" type="text" placeholder="الاسم بالكامل">
            <select id="fGov" class="inp" onchange="loadCity()"><option value="">اختر المحافظة...</option></select>
            <select id="fCity" class="inp" disabled><option value="">اختر المدينة...</option></select>
            <input id="fAddr" class="inp" type="text" placeholder="العنوان بالتفصيل">
            <button class="btn-buy" onclick="sendWa()">إرسال الطلب</button>
            <button onclick="closeM('form')" style="width:100%; padding:10px; background:transparent; border:1px solid #555; color:#ccc; margin-top:10px; border-radius:5px;">إلغاء</button>
        </div>
    </div>

    <script>
        // داتا المحافظات
        const govs = {
            "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع", "شبرا"],
            "الجيزة": ["الهرم", "فيصل", "الدقي", "6 أكتوبر", "الشيخ زايد"],
            "الإسكندرية": ["سموحة", "ميامي", "المنتزه", "العجمي"],
            "القليوبية": ["بنها", "شبرا الخيمة", "العبور"],
            "باقي المحافظات": ["أخرى"]
        };

        // داتا المنتجات (تم وضع روابطك + كود حماية للصور)
        const items = [
            {id:1, t:'top', n:'Hoodie Skull Black', p:600, f:'https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg', b:'https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'},
            {id:2, t:'top', n:'Hoodie Dope Shine', p:600, f:'https://i.postimg.cc/Xv0Xy5Qj/1000012716.jpg', b:'https://i.postimg.cc/GmR2gq4P/1000012717.jpg'},
            {id:3, t:'top', n:'Zip-Up Preface Black', p:650, f:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg', b:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg'},
            {id:4, t:'top', n:'Zip-Up Preface White', p:650, f:'https://i.postimg.cc/7Zh0V1P2/1000012701.jpg', b:'https://i.postimg.cc/7Zh0V1P2/1000012701.jpg'},
            {id:5, t:'bottom', n:'Jeans Light Blue', p:600, f:'https://i.postimg.cc/zByvgp1V/IMG_20260210_WA0023.jpg', b:'https://i.postimg.cc/j5D27vrD/IMG-20260210-WA0022.jpg'},
            {id:6, t:'bottom', n:'Jeans Mod 1', p:600, f:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg', b:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg'},
            {id:7, t:'top', n:'Hoodie Eye & Hand', p:600, f:'https://i.postimg.cc/HWQ7xW1L/1000012695.jpg', b:'https://i.postimg.cc/qRJ1zL9z/1000012696.jpg'},
            {id:8, t:'top', n:'Hoodie Angel Wings', p:600, f:'https://i.postimg.cc/Qd1n4yqR/1000012698.jpg', b:'https://i.postimg.cc/Prh5xWqL/1000012697.jpg'},
            {id:9, t:'top', n:'Hoodie Graphic', p:600, f:'https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg', b:'https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg'},
            {id:10, t:'top', n:'Tracksuit Black', p:900, f:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg', b:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg'},
            {id:11, t:'top', n:'Premium Sweatshirt', p:800, f:'https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg', b:'https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg'},
            {id:12, t:'bottom', n:'Jeans Mod 2', p:600, f:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg', b:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg'},
            {id:13, t:'bottom', n:'Jeans Mod 3', p:600, f:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg', b:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg'},
            {id:14, t:'bottom', n:'Jeans Mod 4', p:600, f:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg', b:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg'},
            {id:15, t:'bottom', n:'Jeans Mod 5', p:600, f:'https://i.postimg.cc/XJb1Z15q/IMG_20260211_WA0004.jpg', b:'https://i.postimg.cc/Kz2pKpTR/IMG_20260211_WA0005.jpg'},
            {id:16, t:'top', n:'Sweatshirt Basic', p:650, f:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg', b:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg'}
        ];

        let curr = null;

        // التشغيل
        window.onload = function() {
            // ملء المحافظات
            const s = document.getElementById('fGov');
            for(let g in govs) { let o = document.createElement('option'); o.value=g; o.innerText=g; s.appendChild(o); }

            // عرض المنتجات
            render(items.filter(i => [3, 2, 5, 10].includes(i.id)), 'grid-home');
            render(items.filter(i => i.t === 'top'), 'grid-hoodies');
            render(items.filter(i => i.t === 'bottom'), 'grid-pants');
        };

        function render(arr, id) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            arr.forEach(i => {
                el.innerHTML += `
                <div class="card">
                    <div class="img-box" onclick="show(${i.id})">
                        <img src="${i.f}" onerror="this.src='https://placehold.co/600x600/111/D4AF37?text=DISHA+BRAND'">
                    </div>
                    <div class="info">
                        <div class="p-name">${i.n}</div>
                        <div class="price">${i.p} ج.م</div>
                        <button class="btn-details" onclick="show(${i.id})">التفاصيل</button>
                    </div>
                </div>`;
            });
        }

        // التنقل
        window.go = function(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display='none');
            document.getElementById(id).style.display='block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('b-'+id)) document.getElementById('b-'+id).classList.add('active');
            window.scrollTo(0,0);
        }

        // المودال
        window.show = function(id) {
            curr = items.find(x => x.id === id);
            document.getElementById('vName').innerText = curr.n;
            document.getElementById('vPrice').innerText = curr.p + " ج.م";
            document.getElementById('vImg').src = curr.f;
            
            // إخفاء زراير التبديل لو الصور زي بعض
            document.getElementById('btns-sw').style.display = (curr.f === curr.b) ? 'none' : 'flex';
            
            document.getElementById('viewer').style.display = 'flex';
        }

        window.closeM = function(id) { document.getElementById(id).style.display='none'; }
        window.swImg = function(s) { document.getElementById('vImg').src = (s==='f') ? curr.f : curr.b; }
        window.openForm = function() { closeM('viewer'); document.getElementById('form').style.display='flex'; }

        window.loadCity = function() {
            const g = document.getElementById('fGov').value;
            const c = document.getElementById('fCity');
            c.innerHTML = '<option>اختر المدينة...</option>';
            c.disabled = true;
            if(govs[g]) {
                c.disabled = false;
                govs[g].forEach(x => { let o=document.createElement('option'); o.value=x; o.innerText=x; c.appendChild(o); });
            }
        }

        window.sendWa = function() {
            const n=document.getElementById('fName').value;
            const g=document.getElementById('fGov').value;
            const c=document.getElementById('fCity').value;
            const a=document.getElementById('fAddr').value;
            
            if(!n || !g || !c || !a) { alert('من فضلك أكمل البيانات'); return; }
            
            const msg = `طلب جديد: ${curr.n}%0aالسعر: ${curr.p}%0aالعميل: ${n}%0aالعنوان: ${g} - ${c} - ${a}`;
            window.open(`https://wa.me/201284381589?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
