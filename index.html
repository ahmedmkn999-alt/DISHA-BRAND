<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISHA BRAND | ديشا براند للملابس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --gold: #D4AF37;
            --text-main: #ffffff;
            --text-sec: #aaaaaa;
            --price-old: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            background-color: rgba(15, 15, 15, 0.95);
            padding: 10px 5%;
            position: fixed;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            height: 60px; /* حجم اللوجو */
            width: auto;
            border-radius: 5px;
        }

        .brand-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* --- Hero Section --- */
        .hero {
            height: 80vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--bg-color)), url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg');
            background-size: cover;
            background-position: center top;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 50px;
            padding-top: 80px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-sec);
            margin-bottom: 30px;
        }

        .btn-shop {
            padding: 12px 50px;
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.1rem;
            transition: 0.3s;
            border: 2px solid var(--gold);
        }

        .btn-shop:hover {
            background-color: transparent;
            color: var(--gold);
        }

        /* --- Products Grid --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--gold);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
            position: relative;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 3/4; /* نسبة أبعاد مثالية للملابس */
            position: relative;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease-in-out;
        }

        /* تأثير تبديل الصورة عند الماوس */
        .img-back {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }

        .card:hover .img-back {
            opacity: 1;
        }

        .card:hover .img-front {
            opacity: 0; /* تختفي الصورة الأمامية لتظهر الخلفية */
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--price-old);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .info {
            padding: 15px;
            text-align: center;
        }

        .name {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .prices {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .current-price {
            color: var(--gold);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .old-price {
            color: var(--text-sec);
            text-decoration: line-through;
            font-size: 0.9rem;
        }

        .btn-buy {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background-color: #25D366; /* لون الواتس */
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-buy:hover {
            background-color: #128C7E;
        }

        /* --- Footer --- */
        footer {
            margin-top: 80px;
            padding: 40px;
            background-color: #000;
            text-align: center;
            border-top: 1px solid #333;
        }

        /* Responsive Fixes */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card { border-radius: 10px; }
            .info { padding: 10px; }
            .name { font-size: 0.9rem; }
            .current-price { font-size: 1.1rem; }
            .btn-buy { font-size: 0.9rem; padding: 8px; }
        }
    </style>
</head>
