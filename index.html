<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f0f0f; --card-bg: #1a1a1a; --gold: #D4AF37; --green: #25D366; --blue: #007bff; --text: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow-x: hidden; padding-bottom: 80px; }

        /* الهيدر */
        header { background: rgba(15, 15, 15, 0.95); padding: 10px 5%; position: fixed; width: 100%; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo-img { height: 50px; border-radius: 5px; border: 1px solid var(--gold); }
        .brand-name { font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 1.2rem; font-weight: bold; margin-right: 10px; }

        /* الواجهة */
        .hero { height: 70vh; background: linear-gradient(to bottom, rgba(0,0,0,0.6), var(--bg)), url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 2.5rem; font-weight: 900; color: white; text-transform: uppercase; font-family: 'Oswald', sans-serif; }
        .btn-main { padding: 10px 30px; background: var(--gold); color: black; font-weight: bold; border-radius: 30px; text-decoration: none; margin-top: 20px; display: inline-block; }

        /* الشبكة */
        .container { padding: 20px 10px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 1.8rem; color: var(--gold); margin: 30px 0 20px 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* الكارت */
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #333; position: relative; }
        .img-box { position: relative; width: 100%; padding-top: 130%; overflow: hidden; }
        .prod-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: bold; }
        
        .info { padding: 10px; text-align: center; }
        .p-name { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 900; font-size: 1rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-right: 5px; }
        
        .btn-view {
            width: 100%; padding: 8px; 
            background: var(--green); color: white; border: none; 
            border-radius: 5px; font-weight: bold; cursor: pointer; 
            margin-top: 5px; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* المودال (النافذة المنبثقة) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; overflow-y: auto; }
        .modal-header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .modal-body { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .main-img-box { width: 100%; max-width: 400px; height: 400px; border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 15px; position: relative; }
        .view-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }
        .zoomed { transform: scale(2.5); cursor: zoom-out; }

        .ctrl-btns { display: flex; gap: 15px; margin-bottom: 20px; }
        .sw-btn { background: #333; color: white; padding: 8px 25px; border-radius: 20px; border: 1px solid #555; cursor: pointer; }
        .sw-btn.active { border-color: var(--gold); color: var(--gold); }

        .big-btn { width: 100%; padding: 15px; background: var(--gold); color: black; border: none; font-weight: bold; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* مودال الطلب */
        .form-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .form-content { background: #222; padding: 20px; width: 90%; max-width: 350px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; }
        .inp { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; }
        .btn-whatsapp { background: var(--green); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-call { background: var(--blue); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; display: block; text-decoration: none; margin-bottom: 10px; }
        .btn-close { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; }

        footer { padding: 20px; text-align: center; background: #000; margin-top: 40px; border-top: 1px solid #333; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center;">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img">
            <span class="brand-name">DISHA</span>
        </div>
        <i class="fas fa-shopping-bag" style="color:white; font-size:1.5rem;"></i>
    </header>

    <section class="hero">
        <h1>STREETWEAR <br> <span style="color:var(--gold)">2026</span></h1>
        <a href="#shop" class="btn-main">تسوق الآن</a>
    </section>

    <section id="shop" class="container">
        <h2 class="section-title">الكولكشن الجديد</h2>
        <div class="grid" id="productsGrid">
            </div>
    </section>

    <div id="prodModal" class="modal">
        <div class="modal-header">
            <h3 style="color:var(--gold); margin:0;" id="mName">اسم المنتج</h3>
            <i class="fas fa-times" style="color:white; font-size:1.5rem; cursor:pointer;" onclick="closeModal()"></i>
        </div>
        <div class="modal-body">
            <div class="main-img-box" onclick="toggleZoom()">
                <img src="" id="mImg" class="view-img">
            </div>
            <p style="color:#777; font-size:0.8rem; margin-bottom:10px;">اضغط على الصورة للتكبير</p>
            
            <div class="ctrl-btns">
                <button class="sw-btn active" id="btnFront" onclick="switchImg('front')">الوش</button>
                <button class="sw-btn" id="btnBack" onclick="switchImg('back')">الضهر</button>
            </div>

            <div style="text-align:center; margin-bottom:20px;">
                <span id="mPrice" style="color:var(--gold); font-size:1.5rem; font-weight:bold;">000</span>
                <span id="mOldPrice" style="color:#777; text-decoration:line-through; margin-right:10px;">000</span>
            </div>

            <button class="big-btn" onclick="openOrder()">تنفيذ الطلب</button>
        </div>
    </div>

    <div id="formModal" class="form-modal">
        <div class="form-content">
            <h3 style="color:var(--gold); margin-bottom:15px;">بيانات الشحن</h3>
            <input type="text" id="cName" class="inp" placeholder="الاسم بالكامل">
            <select id="cGov" class="inp" onchange="loadCities()">
                <option value="">اختر المحافظة...</option>
            </select>
            <select id="cCity" class="inp" disabled>
                <option value="">اختر المدينة...</option>
            </select>
            <input type="text" id="cAddr" class="inp" placeholder="العنوان بالتفصيل">
            
            <button class="btn-whatsapp" onclick="sendOrder('whatsapp')"><i class="fab fa-whatsapp"></i> طلب واتساب</button>
            <a href="tel:01117943368" class="btn-call"><i class="fas fa-phone"></i> اتصال هاتفي</a>
            <button class="btn-close" onclick="closeForm()">إلغاء</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p>
        <p style="color:#555; margin-top:5px;">Created by <a href="https://wa.me/201128381838" style="color:var(--gold); text-decoration:none;">Ahmed Mohamed</a></p>
    </footer>

    <script>
        // --- 1. قاعدة بيانات المنتجات (الـ 13 منتج كلهم هنا) ---
        const products = [
            { id: 1, name: "هودي أسود (Black Skull)", price: 600, old: 750, f: "https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg", b: "https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg" },
            { id: 2, name: "هودي أوف وايت (Graphic)", price: 600, old: 750, f: "https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg", b: "https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg" },
            { id: 3, name: "هودي رصاصي طباعة", price: 600, old: 700, f: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg", b: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg" },
            { id: 4, name: "سويت شيرت بيسك (أسود)", price: 650, old: 800, f: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg", b: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg" },
            { id: 5, name: "سويت شيرت بيسك (رصاصي)", price: 650, old: 800, f: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg", b: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg" },
            { id: 6, name: "سويت شيرت بيسك (أوف وايت)", price: 650, old: 800, f: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg", b: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg" },
            { id: 7, name: "سويت شيرت بريميم (أسود)", price: 800, old: 1000, f: "https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg", b: "https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg" },
            { id: 8, name: "سويت شيرت بريميم (هافان)", price: 800, old: 1000, f: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg", b: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg" },
            { id: 9, name: "ترنج كامل (أسود)", price: 900, old: 1000, f: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg", b: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg" },
            { id: 10, name: "ترنج كامل (رصاصي)", price: 900, old: 1000, f: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg", b: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg" },
            { id: 11, name: "سويت شيرت هاي إند (أسود)", price: 1300, old: 1500, f: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg", b: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg" },
            { id: 12, name: "سويت شيرت هاي إند (بيج)", price: 1300, old: 1500, f: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg", b: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg" },
            { id: 13, name: "بنطلون كارجو/جينز", price: 700, old: 800, f: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg", b: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg" }
        ];

        const egyptData = {
            "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع", "شبرا", "وسط البلد"],
            "الجيزة": ["الدقي", "المهندسين", "الهرم", "فيصل", "6 أكتوبر", "الشيخ زايد", "إمبابة"],
            "الإسكندرية": ["سموحة", "ميامي", "المنتزه", "العجمي", "سيدي جابر"],
            "القليوبية": ["بنها", "شبرا الخيمة", "قليوب", "العبور"],
            "الدقهلية": ["المنصورة", "ميت غمر"],
            "الشرقية": ["الزقازيق", "العشر من رمضان"],
            "الغربية": ["طنطا", "المحلة"],
            "المنوفية": ["شبين الكوم", "السادات"],
            "باقي المحافظات": ["اكتب اسم مدينتك في العنوان"]
        };

        // --- 2. رسم المنتجات (الكود ده بيحط المنتجات في الصفحة) ---
        const grid = document.getElementById('productsGrid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="badge">SALE</div>
                <div class="img-box" onclick="openViewer(${p.id})">
                    <img src="${p.f}" class="prod-img">
                </div>
                <div class="info">
                    <div class="p-name">${p.name}</div>
                    <div><span class="price">${p.price} ج.م</span> <span class="old-price">${p.old}</span></div>
                    <button class="btn-view" onclick="openViewer(${p.id})">
                        <i class="fas fa-eye"></i> التفاصيل
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- 3. المتغيرات العامة ---
        let selectedProduct = null;
        let isFront = true;

        // --- 4. الوظائف (بسيطة ومباشرة عشان الموبايل) ---
        function openViewer(id) {
            // بنجيب المنتج من الـ ID بتاعه
            selectedProduct = products.find(x => x.id == id);
            
            document.getElementById('mName').innerText = selectedProduct.name;
            document.getElementById('mPrice').innerText = selectedProduct.price + " ج.م";
            document.getElementById('mOldPrice').innerText = selectedProduct.old;
            
            isFront = true;
            updateImage();
            
            document.getElementById('prodModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('prodModal').style.display = 'none';
        }

        function updateImage() {
            const img = document.getElementById('mImg');
            img.src = isFront ? selectedProduct.f : selectedProduct.b;
            img.classList.remove('zoomed');
            
            // تلوين الزراير
            document.getElementById('btnFront').classList.toggle('active', isFront);
            document.getElementById('btnBack').classList.toggle('active', !isFront);
        }

        function switchImg(side) {
            isFront = (side === 'front');
            updateImage();
        }

        function toggleZoom() {
            document.getElementById('mImg').classList.toggle('zoomed');
        }

        // --- 5. وظائف الطلب ---
        function openOrder() {
            closeModal();
            document.getElementById('formModal').style.display = 'flex';
            
            // تعبئة المحافظات مرة واحدة بس
            const sel = document.getElementById('cGov');
            if (sel.options.length <= 1) {
                for (let g in egyptData) {
                    let opt = document.createElement('option');
                    opt.value = g; opt.innerText = g;
                    sel.appendChild(opt);
                }
            }
        }

        function closeForm() {
            document.getElementById('formModal').style.display = 'none';
        }

        function loadCities() {
            const gov = document.getElementById('cGov').value;
            const citySel = document.getElementById('cCity');
            citySel.innerHTML = '<option value="">اختر المدينة...</option>';
            
            if(gov && egyptData[gov]) {
                citySel.disabled = false;
                egyptData[gov].forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    citySel.appendChild(opt);
                });
            } else {
                citySel.disabled = true;
            }
        }

        function sendOrder(type) {
            if (type === 'whatsapp') {
                const name = document.getElementById('cName').value;
                const gov = document.getElementById('cGov').value;
                const city = document.getElementById('cCity').value;
                const addr = document.getElementById('cAddr').value;

                if (!name || !gov || !city || !addr) {
                    alert('من فضلك أكمل البيانات');
                    return;
                }

                const msg = `طلب جديد: ${selectedProduct.name}%0aالسعر: ${selectedProduct.price} جنيه%0a-- العميل --%0aالاسم: ${name}%0aالعنوان: ${gov} - ${city} - ${addr}`;
                window.open(`https://wa.me/201284381589?text=${msg}`, '_blank');
            }
            closeForm();
        }
    </script>
</body>
    </html>
