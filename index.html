    <style>
        :root { --bg: #0f0f0f; --card-bg: #1a1a1a; --gold: #D4AF37; --green: #25D366; --blue: #007bff; --text: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow-x: hidden; padding-bottom: 80px; padding-top: 70px; }

        /* --- Header & Navigation --- */
        header { 
            background: rgba(15, 15, 15, 0.98); 
            padding: 0 5%; 
            position: fixed; top: 0; left: 0; width: 100%; 
            z-index: 1000; 
            border-bottom: 1px solid #333;
            height: 70px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 45px; border-radius: 5px; border: 1px solid var(--gold); }
        .brand-name { font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 1.2rem; font-weight: bold; }

        /* القائمة العلوية */
        .nav-links { display: flex; gap: 20px; }
        .nav-btn { 
            background: none; border: none; 
            color: #aaa; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 1rem; 
            cursor: pointer; padding: 5px 10px; transition: 0.3s; position: relative;
        }
        .nav-btn.active { color: var(--gold); }
        .nav-btn.active::after {
            content: ''; position: absolute; bottom: -23px; left: 0; width: 100%; height: 3px; background: var(--gold);
        }

        /* --- Pages Structure --- */
        .page-section { display: none; animation: fadeIn 0.5s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Home Page Specifics --- */
        .hero { 
            height: 60vh; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--bg)), url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'); 
            background-size: cover; background-position: center; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            margin-bottom: 30px; border-radius: 0 0 20px 20px;
        }
        .hero h1 { font-size: 2.5rem; font-weight: 900; color: white; text-transform: uppercase; font-family: 'Oswald', sans-serif; text-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .hero p { color: #ddd; margin-bottom: 20px; font-size: 1.1rem; }
        .btn-main { padding: 12px 40px; background: var(--gold); color: black; font-weight: bold; border-radius: 30px; cursor: pointer; border: none; font-size: 1rem; }

        .category-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px; margin-bottom: 40px; }
        .cat-card { 
            height: 150px; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #333;
        }
        .cat-img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; opacity: 0.7; }
        .cat-title { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; font-weight: 900; font-size: 1.2rem; text-shadow: 0 2px 5px black; z-index: 2;
        }
        .cat-card:hover .cat-img { transform: scale(1.1); opacity: 1; }

        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; margin-bottom: 15px; border-right: 4px solid var(--gold); }
        .sec-title { font-size: 1.3rem; font-weight: bold; color: white; }
        .see-all { color: var(--gold); font-size: 0.9rem; cursor: pointer; }

        /* --- Shared Grid Style --- */
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* --- Product Card --- */
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #333; position: relative; }
        .img-box { position: relative; width: 100%; padding-top: 130%; overflow: hidden; }
        .prod-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: bold; }
        
        .info { padding: 10px; text-align: center; }
        .p-name { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 900; font-size: 1rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-right: 5px; }
        
        .btn-view {
            width: 100%; padding: 8px; background: var(--green); color: white; border: none; 
            border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* --- Modals (Popups) --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; overflow-y: auto; }
        .modal-header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .modal-body { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .main-img-box { width: 100%; max-width: 400px; height: 400px; border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 15px; position: relative; }
        .view-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }
        .zoomed { transform: scale(2.5); cursor: zoom-out; }

        .ctrl-btns { display: flex; gap: 15px; margin-bottom: 20px; }
        .sw-btn { background: #333; color: white; padding: 8px 25px; border-radius: 20px; border: 1px solid #555; cursor: pointer; }
        .sw-btn.active { border-color: var(--gold); color: var(--gold); }

        .big-btn { width: 100%; padding: 15px; background: var(--gold); color: black; border: none; font-weight: bold; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* Form Modal */
        .form-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .form-content { background: #222; padding: 20px; width: 90%; max-width: 350px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; }
        .inp { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; }
        .btn-whatsapp { background: var(--green); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-call { background: var(--blue); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; display: block; text-decoration: none; margin-bottom: 10px; }
        .btn-close { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; }

        /* Custom Menu */
        .custom-menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); padding: 15px; border-radius: 10px; border: 1px solid var(--gold); z-index: 9999; width: 250px; text-align: center; display: none; }
        .menu-btn { display: block; width: 100%; padding: 10px; background: transparent; color: white; border: none; text-align: right; font-size: 1rem; cursor: pointer; }
        .menu-btn i { margin-left: 10px; color: var(--gold); }

        footer { padding: 20px; text-align: center; background: #000; margin-top: 40px; border-top: 1px solid #333; font-size: 0.8rem; }
