<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f0f0f; --card-bg: #1a1a1a; --gold: #D4AF37; --green: #25D366; --text: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-bottom: 80px; padding-top: 70px; overflow-x: hidden; }

        /* Header */
        header { 
            background: rgba(0,0,0,0.9); border-bottom: 1px solid #333;
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 9999;
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            backdrop-filter: blur(10px);
        }
        .logo-text { font-family: 'Oswald'; color: var(--gold); font-size: 1.5rem; font-weight: bold; border: 2px solid var(--gold); padding: 2px 10px; border-radius: 5px; }
        
        .nav-links { display: flex; gap: 5px; }
        .nav-btn {
            background: none; border: none; color: #aaa; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; padding: 8px 10px; font-family: 'Cairo'; transition: 0.3s;
        }
        .nav-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* Pages */
        .page { display: none; width: 100%; animation: fadeIn 0.5s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Hero Video Section --- */
        .hero-container {
            position: relative;
            height: 60vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            margin-bottom: 20px;
            background: #000;
        }

        #heroVideo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: 1;
            object-fit: cover;
            opacity: 0.6;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
        }

        .hero-content h1 { 
            color: white; font-family: 'Oswald'; font-size: 3rem; 
            text-shadow: 0 0 20px black; margin: 0; line-height: 1.1;
        }
        .hero-btn {
            background: var(--gold); border: none; padding: 12px 40px; 
            font-weight: bold; font-size: 1.1rem; color: black;
            border-radius: 30px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* Grid System */
        .sec-title { padding: 0 15px; margin-bottom: 15px; border-right: 4px solid var(--gold); color: white; font-weight: bold; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: #151515; border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        
        .img-area { position: relative; padding-top: 125%; cursor: pointer; background: #222; }
        .img-area img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .badge { position: absolute; top: 5px; right: 5px; background: #d00; color: white; padding: 2px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: bold; z-index: 2; }

        .details { padding: 10px; text-align: center; }
        .p-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; color: #fff; }
        .price { color: var(--gold); font-weight: 900; font-size: 1.1rem; }
        .old-price { text-decoration: line-through; color: #666; font-size: 0.8rem; margin-right: 5px; }
        
        .buy-btn {
            width: 100%; background: var(--green); color: white; border: none; padding: 8px;
            margin-top: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black;
            z-index: 10000; display: none; flex-direction: column; overflow-y: auto;
        }
        .modal-head { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #222; border-bottom: 1px solid #333; }
        .modal-content { padding: 20px; text-align: center; }
        .main-img { width: 100%; height: 400px; object-fit: contain; border: 1px solid #333; margin-bottom: 15px; border-radius: 10px; background: #111; }
        
        .action-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .whatsapp { background: var(--green); color: white; }
        .call { background: #007bff; color: white; }
        .cancel { background: transparent; border: 1px solid #555; color: #ccc; }
        .inp { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; margin-bottom: 12px; border-radius: 5px; font-size: 1rem; }

    </style>
</head>
<body>

    <header>
        <div class="logo-text" onclick="window.goPage('home')">DISHA</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="window.goPage('home')" id="btn-home">الرئيسية</button>
            <button class="nav-btn" onclick="window.goPage('hoodies')" id="btn-hoodies">هوديز</button>
            <button class="nav-btn" onclick="window.goPage('pants')" id="btn-pants">بناطيل</button>
        </div>
    </header>

    <div id="home" class="page active">
        <div class="hero-container">
            <video id="heroVideo" autoplay muted loop playsinline>
                <source src="https://drive.google.com/uc?export=download&id=10xl9h6X9JlIGluS68mv_87RMlShPk4g-" type="video/mp4">
            </video>
            <div class="hero-content">
                <h1>STREETWEAR<br><span style="color:var(--gold)">2026</span></h1>
                <button class="hero-btn" onclick="window.goPage('hoodies')">تسوق الآن</button>
            </div>
        </div>

        <div class="sec-title">الأكثر مبيعاً 🔥</div>
        <div class="grid" id="home-grid"></div>
    </div>

    <div id="hoodies" class="page">
        <div class="sec-title" style="margin-top: 20px;">قسم الهوديز & سويت شيرت</div>
        <div class="grid" id="hoodies-grid"></div>
    </div>

    <div id="pants" class="page">
        <div class="sec-title" style="margin-top: 20px;">قسم البناطيل & جينز</div>
        <div class="grid" id="pants-grid"></div>
    </div>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <h3 style="color: var(--gold); margin:0;" id="vName">اسم المنتج</h3>
            <button onclick="window.closeViewer()" style="background: none; border: none; color: white; font-size: 1.5rem;">✕</button>
        </div>
        <div class="modal-content">
            <img src="" id="vImg" class="main-img">
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                <button onclick="window.changeSide('f')" style="padding: 8px 25px; background: #333; color: white; border: 1px solid #555; border-radius: 20px;">الوش</button>
                <button onclick="window.changeSide('b')" style="padding: 8px 25px; background: #333; color: white; border: 1px solid #555; border-radius: 20px;">الضهر</button>
            </div>
            <h2 style="color: var(--gold); margin-bottom: 10px;" id="vPrice">000</h2>
            <button class="action-btn whatsapp" onclick="window.showOrderForm()"><i class="fab fa-whatsapp"></i> اشترِ الآن</button>
        </div>
    </div>

    <div id="orderForm" class="modal" style="background: rgba(0,0,0,0.95); justify-content: center;">
        <div style="background: #1a1a1a; padding: 25px; width: 90%; max-width: 350px; border: 1px solid var(--gold); border-radius: 15px; margin: auto;">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 20px;">بيانات الشحن</h3>
            <input type="text" id="cName" class="inp" placeholder="الاسم بالكامل">
            <input type="text" id="cAddr" class="inp" placeholder="العنوان ورقم التليفون">
            
            <button class="action-btn whatsapp" onclick="window.sendWhatsapp()">تأكيد واتساب</button>
            <button class="action-btn call" onclick="window.open('tel:01117943368')">اتصال هاتفي</button>
            <button class="action-btn cancel" onclick="document.getElementById('orderForm').style.display='none'">إلغاء</button>
        </div>
    </div>

    <script>
        // --- الصور (تم وضع روابط بديلة شغالة 100% عشان الموقع يفتح) ---
        // ملاحظة: استبدل الروابط دي بروابطك الجديدة لما ترفعها على موقع imgbb.com أو imgur.com
        const products = [
            // الهوديز (Best Sellers)
            {id:1, type:'top', name:'Zip-Up Hoodie (Preface Black)', price:650, old:800, f:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=600&auto=format&fit=crop'},
            {id:2, type:'top', name:'Hoodie (Dope Shine White)', price:600, old:750, f:'https://images.unsplash.com/photo-1620799140408-ed5341cd2431?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1620799140408-ed5341cd2431?q=80&w=600&auto=format&fit=crop'},
            {id:3, type:'top', name:'Hoodie (Graphic Black)', price:600, old:750, f:'https://images.unsplash.com/photo-1578768079052-aa76e52ff62e?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1578768079052-aa76e52ff62e?q=80&w=600&auto=format&fit=crop'},
            
            // البناطيل
            {id:4, type:'bottom', name:'بنطلون جينز (Light Blue)', price:600, old:750, f:'https://images.unsplash.com/photo-1542272454315-4c01d7abdf4a?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1542272454315-4c01d7abdf4a?q=80&w=600&auto=format&fit=crop'},
            {id:5, type:'bottom', name:'بنطلون جينز (Cargo Style)', price:600, old:750, f:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?q=80&w=600&auto=format&fit=crop'},
            {id:6, type:'bottom', name:'بنطلون جينز (Streetwear)', price:600, old:750, f:'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=600&auto=format&fit=crop'},
            
            // باقي الهوديز
            {id:7, type:'top', name:'Zip-Up Hoodie (White)', price:650, old:800, f:'https://images.unsplash.com/photo-1614975058789-41316d0e2e9c?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1614975058789-41316d0e2e9c?q=80&w=600&auto=format&fit=crop'},
            {id:8, type:'top', name:'Hoodie (Angel Wings)', price:600, old:750, f:'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=600&auto=format&fit=crop'},
            {id:9, type:'top', name:'ترنج كامل (Black)', price:900, old:1000, f:'https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?q=80&w=600&auto=format&fit=crop', b:'https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?q=80&w=600&auto=format&fit=crop'}
        ];

        let currentP = null;

        // --- دوال التشغيل (Global Functions) ---
        window.onload = function() {
            try {
                // عرض المنتجات
                window.render(products.filter(p => [1, 2, 4, 9].includes(p.id)), 'home-grid');
                window.render(products.filter(p => p.type === 'top'), 'hoodies-grid');
                window.render(products.filter(p => p.type === 'bottom'), 'pants-grid');
            } catch(e) { console.error(e); }
        };

        window.render = function(list, id) {
            const container = document.getElementById(id);
            if(!container) return;
            container.innerHTML = '';
            list.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <div class="badge">SALE</div>
                        <div class="img-area" onclick="window.openViewer(${p.id})">
                            <img src="${p.f}" loading="lazy">
                        </div>
                        <div class="details">
                            <div class="p-title">${p.name}</div>
                            <div><span class="price">${p.price} ج.م</span> <span class="old-price">${p.old}</span></div>
                            <button class="buy-btn" onclick="window.openViewer(${p.id})">
                                <i class="fas fa-eye"></i> التفاصيل
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.goPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + pageId);
            if(btn) btn.classList.add('active');
            window.scrollTo(0,0);
        }

        window.openViewer = function(id) {
            currentP = products.find(p => p.id === id);
            if(!currentP) return;
            document.getElementById('vName').innerText = currentP.name;
            document.getElementById('vPrice').innerText = currentP.price + " ج.م";
            document.getElementById('vImg').src = currentP.f;
            document.getElementById('viewer').style.display = 'flex';
        }

        window.closeViewer = function() {
            document.getElementById('viewer').style.display = 'none';
        }

        window.changeSide = function(side) {
            if(!currentP) return;
            document.getElementById('vImg').src = (side === 'f') ? currentP.f : currentP.b;
        }

        window.showOrderForm = function() {
            window.closeViewer();
            document.getElementById('orderForm').style.display = 'flex';
        }

        window.sendWhatsapp = function() {
            const n = document.getElementById('cName').value;
            const a = document.getElementById('cAddr').value;
            if(!n || !a) { alert('اكتب اسمك والعنوان عشان نبعتلك'); return; }
            const txt = `طلب جديد: ${currentP.name}%0aالسعر: ${currentP.price}%0aالعميل: ${n}%0aالعنوان: ${a}`;
            window.open(`https://wa.me/201284381589?text=${txt}`, '_blank');
            document.getElementById('orderForm').style.display = 'none';
        }
    </script>
</body>
</html>
