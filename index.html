<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://pl28692420.effectivegatecpm.com/0f/62/cc/0f62cc9ba1a0f4918384261a49a38e8f.js"></script>
    <style>
        /* --- التصميم والألوان --- */
        :root { --bg: #000; --card: #111; --gold: #D4AF37; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-top: 60px; padding-bottom: 50px; }

        /* --- الهيدر --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--gold);
            z-index: 9999; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-img { height: 40px; border: 1px solid var(--gold); border-radius: 5px; }
        .brand { font-family: 'Oswald'; color: var(--gold); font-size: 1.4rem; font-weight: bold; }
        .nav-links button { background: none; border: none; color: #ccc; font-weight: bold; margin-left: 5px; cursor: pointer; padding: 5px; }
        .nav-links button.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* --- منطقة الفيديو (ممنوع اللمس عشان الزراير تشتغل) --- */
        .hero {
            position: relative; height: 40vh; width: 100%; overflow: hidden; border-bottom: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; /* سحر الكود: بيخلي الفيديو غير قابل للمس */
        }
        .video-bg iframe {
            width: 300%; height: 150%; /* زوم عشان يخفي شعار يوتيوب */
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0.6; pointer-events: none;
        }
        .hero-content {
            position: relative; z-index: 10; text-align: center; width: 100%;
            pointer-events: none; /* عشان اللمس يعدي للمساحات الفاضية */
        }
        .hero-content h1 { font-family: 'Oswald'; font-size: 3rem; margin: 0; text-shadow: 0 5px 15px black; line-height: 1; }
        .hero-content h2 { color: var(--gold); font-family: 'Oswald'; font-size: 1.8rem; margin: 0; text-shadow: 0 5px 10px black; }
        
        .hero-btn {
            background: var(--gold); color: #000; border: none;
            padding: 12px 40px; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; margin-top: 15px; cursor: pointer;
            box-shadow: 0 0 20px rgba(212,175,55,0.5);
            pointer-events: auto; /* تفعيل الزرار غصب عن الفيديو */
        }

        /* --- المنتجات --- */
        .section-title { padding: 10px 15px; color: var(--gold); font-size: 1.2rem; font-weight: bold; border-right: 4px solid var(--gold); margin: 20px 0; background: linear-gradient(90deg, #111, transparent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .img-box { position: relative; padding-top: 125%; background: #222; }
        .img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; z-index: 2; }
        
        .info { padding: 8px; text-align: center; }
        .p-name { font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 900; font-size: 1rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-right: 5px; }
        
        .btn-details {
            width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 6px; margin-top: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }

        /* --- الصفحات --- */
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }

        /* --- المودال --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; display: none; flex-direction: column; }
        .modal-head { padding: 15px; display: flex; justify-content: space-between; background: #111; border-bottom: 1px solid #333; }
        .modal-body { padding: 20px; text-align: center; }
        .big-img { width: 100%; height: 400px; object-fit: contain; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 15px; }
        
        .ctrl-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .sw-btn { padding: 8px 25px; background: #222; color: white; border: 1px solid #444; border-radius: 20px; cursor: pointer; }
        .sw-btn.active { border-color: var(--gold); color: var(--gold); }

        .btn-buy { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        
        /* فورم الطلب */
        .inp { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #555; color: white; border-radius: 5px; text-align: right; }
        select.inp { background: #222; }

        /* Footer */
        footer { background: #000; padding: 20px; text-align: center; border-top: 1px solid #333; margin-top: 30px; font-size: 0.8rem; color: #666; }
        footer span { color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="go('home')">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img">
            <span class="brand">DISHA</span>
        </div>
        <div class="nav-links">
            <button class="active" id="b-home" onclick="go('home')">الرئيسية</button>
            <button id="b-hoodies" onclick="go('hoodies')">هوديز</button>
            <button id="b-pants" onclick="go('pants')">بناطيل</button>
        </div>
    </header>

    <div id="home" class="page active">
        <div class="hero">
            <div class="video-bg">
                <iframe src="https://www.youtube.com/embed/7ldPYcZ-oaU?autoplay=1&mute=1&controls=0&loop=1&playlist=7ldPYcZ-oaU&playsinline=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="hero-content">
                <h1>STREETWEAR</h1>
                <h2>2026</h2>
                <button class="hero-btn" onclick="go('hoodies')">تسوق الآن</button>
            </div>
        </div>
        
        <div class="section-title">الأكثر مبيعاً 🔥</div>
        <div class="grid" id="grid-home"></div>
        
        <footer>
            <p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p>
            <p>Designed by <span>Ahmed Mohamed</span></p>
        </footer>
    </div>

    <div id="hoodies" class="page">
        <div class="section-title">قسم الهوديز & سويت شيرت</div>
        <div class="grid" id="grid-hoodies"></div>
        <footer><p>Designed by <span>Ahmed Mohamed</span></p></footer>
    </div>

    <div id="pants" class="page">
        <div class="section-title">قسم البناطيل & جينز</div>
        <div class="grid" id="grid-pants"></div>
        <footer><p>Designed by <span>Ahmed Mohamed</span></p></footer>
    </div>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <span style="color:var(--gold); font-weight:bold;" id="vName"></span>
            <span style="color:white; font-size:1.5rem; cursor:pointer;" onclick="closeM('viewer')">✕</span>
        </div>
        <div class="modal-body">
            <img src="" id="vImg" class="big-img" onerror="this.src='https://placehold.co/400x400/111/D4AF37?text=DISHA'">
            
            <div id="btns-sw" class="ctrl-btns">
                <button class="sw-btn active" id="btn-f" onclick="swImg('f')">الوش</button>
                <button class="sw-btn" id="btn-b" onclick="swImg('b')">الضهر</button>
            </div>

            <h2 style="color:var(--gold); margin-bottom:5px;" id="vPrice"></h2>
            <span style="color:#777; text-decoration:line-through;" id="vOld"></span>
            
            <button class="btn-buy" onclick="openForm()">
                <i class="fab fa-whatsapp"></i> اطلب الآن
            </button>
        </div>
    </div>

    <div id="form" class="modal" style="justify-content:center;">
        <div style="background:#151515; padding:25px; width:90%; max-width:400px; border:1px solid var(--gold); border-radius:10px; margin:auto;">
            <h3 style="color:var(--gold); text-align:center; margin-bottom:20px;">بيانات الشحن</h3>
            <input id="fName" class="inp" type="text" placeholder="الاسم بالكامل">
            <select id="fGov" class="inp" onchange="loadCity()"><option value="">اختر المحافظة...</option></select>
            <select id="fCity" class="inp" disabled><option value="">اختر المدينة...</option></select>
            <input id="fAddr" class="inp" type="text" placeholder="العنوان بالتفصيل">
            <button class="btn-buy" onclick="sendWa()">تأكيد واتساب</button>
            <button onclick="closeM('form')" style="width:100%; padding:12px; background:transparent; border:1px solid #555; color:#ccc; margin-top:10px; border-radius:5px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <script>
        const govs = {
            "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع", "شبرا"],
            "الجيزة": ["الهرم", "فيصل", "الدقي", "6 أكتوبر", "الشيخ زايد"],
            "الإسكندرية": ["سموحة", "ميامي", "المنتزه", "العجمي"],
            "القليوبية": ["بنها", "شبرا الخيمة", "قليوب", "العبور"],
            "باقي المحافظات": ["أخرى"]
        };

        const items = [
            // الهوديز
            {id:1, t:'top', n:'Hoodie Skull (Black)', p:600, o:750, f:'https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg', b:'https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'},
            {id:2, t:'top', n:'Sweatshirt Basic (White)', p:650, o:800, f:'https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg', b:'https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg'},
            {id:3, t:'top', n:'Hoodie Graphic (Off-White)', p:600, o:750, f:'https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg', b:'https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg'},
            {id:4, t:'top', n:'Sweatshirt Basic (Grey)', p:650, o:800, f:'https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg', b:'https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg'},
            {id:5, t:'top', n:'Sweatshirt Basic (Black)', p:650, o:800, f:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg', b:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg'},
            {id:6, t:'top', n:'Premium Sweatshirt (Black)', p:800, o:1000, f:'https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg', b:'https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg'},
            {id:7, t:'top', n:'Premium Sweatshirt (Beige)', p:800, o:1000, f:'https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg', b:'https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg'},
            {id:8, t:'top', n:'Tracksuit Full Set (Black)', p:900, o:1000, f:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg', b:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg'},
            {id:9, t:'top', n:'Tracksuit Full Set (Grey)', p:900, o:1000, f:'https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg', b:'https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg'},
            {id:10, t:'top', n:'High-End Sweatshirt (Black)', p:1300, o:1500, f:'https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg', b:'https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg'},
            {id:18, t:'top', n:'Hoodie Printed (Grey)', p:600, o:750, f:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg', b:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg'},
            
            // البناطيل
            {id:11, t:'bottom', n:'Cargo/Jeans Pants', p:700, o:800, f:'https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg', b:'https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg'},
            {id:12, t:'bottom', n:'Jeans Light Blue', p:600, o:750, f:'https://i.postimg.cc/zByvgp1V/IMG_20260210_WA0023.jpg', b:'https://i.postimg.cc/j5D27vrD/IMG-20260210-WA0022.jpg'},
            {id:13, t:'bottom', n:'Jeans Mod 1', p:600, o:750, f:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg', b:'https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg'},
            {id:14, t:'bottom', n:'Jeans Mod 2', p:600, o:750, f:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg', b:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg'},
            {id:15, t:'bottom', n:'Jeans Mod 3', p:600, o:750, f:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg', b:'https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg'},
            {id:16, t:'bottom', n:'Jeans Mod 4', p:600, o:750, f:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg', b:'https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg'},
            {id:17, t:'bottom', n:'Jeans Mod 5', p:600, o:750, f:'https://i.postimg.cc/XJb1Z15q/IMG_20260211_WA0004.jpg', b:'https://i.postimg.cc/Kz2pKpTR/IMG_20260211_WA0005.jpg'},
            
            // New (تأكد من الروابط دي)
            {id:20, t:'top', n:'Zip-Up Preface (Black)', p:650, o:800, f:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg', b:'https://i.postimg.cc/k4vj4X8h/1000012700.jpg'},
            {id:23, t:'top', n:'Hoodie Dope Shine', p:600, o:750, f:'https://i.postimg.cc/Xv0Xy5Qj/1000012716.jpg', b:'https://i.postimg.cc/GmR2gq4P/1000012717.jpg'},
            {id:24, t:'top', n:'Hoodie Eye & Hand', p:600, o:750, f:'https://i.postimg.cc/HWQ7xW1L/1000012695.jpg', b:'https://i.postimg.cc/qRJ1zL9z/1000012696.jpg'}
        ];

        let curr = null;

        window.onload = function() {
            // المحافظات
            const s = document.getElementById('fGov');
            for(let g in govs) { let o = document.createElement('option'); o.value=g; o.innerText=g; s.appendChild(o); }

            // عرض المنتجات
            render(items.filter(i => [1, 8, 12, 13].includes(i.id)), 'grid-home');
            render(items.filter(i => i.t === 'top'), 'grid-hoodies');
            render(items.filter(i => i.t === 'bottom'), 'grid-pants');
        };

        function render(arr, id) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            arr.forEach(i => {
                el.innerHTML += `
                <div class="card">
                    <div class="badge">SALE</div>
                    <div class="img-box" onclick="show(${i.id})">
                        <img src="${i.f}" onerror="this.src='https://placehold.co/400x400/222/D4AF37?text=DISHA'">
                    </div>
                    <div class="info">
                        <div class="p-name">${i.n}</div>
                        <div><span class="price">${i.p} ج.م</span> <span class="old-price">${i.o}</span></div>
                        <button class="btn-details" onclick="show(${i.id})">
                            <i class="fas fa-eye"></i> التفاصيل
                        </button>
                    </div>
                </div>`;
            });
        }

        window.go = function(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display='none');
            document.getElementById(id).style.display='block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('b-'+id).classList.add('active');
            window.scrollTo(0,0);
        }

        window.show = function(id) {
            curr = items.find(x => x.id === id);
            document.getElementById('vName').innerText = curr.n;
            document.getElementById('vPrice').innerText = curr.p + " ج.م";
            document.getElementById('vOld').innerText = curr.o;
            document.getElementById('vImg').src = curr.f;
            
            const btns = document.getElementById('btns-sw');
            if(curr.f === curr.b) btns.style.display='none';
            else {
                btns.style.display='flex';
                document.getElementById('btn-f').classList.add('active');
                document.getElementById('btn-b').classList.remove('active');
            }
            document.getElementById('viewer').style.display = 'flex';
        }

        window.closeM = function(id) { document.getElementById(id).style.display='none'; }
        
        window.swImg = function(s) {
            document.getElementById('vImg').src = (s==='f') ? curr.f : curr.b;
            document.getElementById('btn-f').classList.toggle('active', s==='f');
            document.getElementById('btn-b').classList.toggle('active', s==='b');
        }
        
        window.openForm = function() { closeM('viewer'); document.getElementById('form').style.display='flex'; }

        window.loadCity = function() {
            const g = document.getElementById('fGov').value;
            const c = document.getElementById('fCity');
            c.innerHTML = '<option>اختر المدينة...</option>';
            c.disabled = true;
            if(govs[g]) {
                c.disabled = false;
                govs[g].forEach(x => { let o=document.createElement('option'); o.value=x; o.innerText=x; c.appendChild(o); });
            }
        }

        window.sendWa = function() {
            const n=document.getElementById('fName').value;
            const g=document.getElementById('fGov').value;
            const c=document.getElementById('fCity').value;
            const a=document.getElementById('fAddr').value;
            if(!n || !g || !c || !a) { alert('من فضلك أكمل البيانات'); return; }
            const msg = `طلب جديد: ${curr.n}%0aالسعر: ${curr.p}%0aالعميل: ${n}%0aالعنوان: ${g} - ${c} - ${a}`;
            window.open(`https://wa.me/201284381589?text=${msg}`, '_blank');
        }
    </script>
</body>
                    </html>
