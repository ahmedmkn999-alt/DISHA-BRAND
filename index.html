<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --gold: #D4AF37;
            --green: #25D366;
            --blue: #007bff;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* --- Header --- */
        header {
            background-color: rgba(15, 15, 15, 0.95);
            padding: 10px 5%;
            position: fixed;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        
        .logo-img {
            height: 65px;
            width: auto;
            border-radius: 8px;
            border: 1px solid var(--gold);
        }

        .brand-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: bold;
        }

        /* --- Hero Section --- */
        .hero {
            height: 85vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), var(--bg)), url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 50px;
            padding-top: 80px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Oswald', sans-serif;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 1.3rem;
            color: #ddd;
            margin-bottom: 30px;
        }

        .btn-hero {
            padding: 12px 50px;
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            transition: 0.3s;
            border: 2px solid var(--gold);
        }

        .btn-hero:hover { background-color: transparent; color: var(--gold); }

        /* --- Products Section --- */
        .container { padding: 20px 10px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 30px; color: var(--gold); }

        /* الشبكة (Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* الكارت */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 130%;
            overflow: hidden;
            cursor: pointer;
        }

        .product-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .badge {
            position: absolute; top: 8px; right: 8px;
            background: #d32f2f; color: white;
            padding: 4px 8px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold; z-index: 2;
        }

        .info { padding: 12px; text-align: center; }

        .name { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .price-box { margin-bottom: 10px; }
        .curr { color: var(--gold); font-size: 1.1rem; font-weight: 900; }
        .old { color: #777; font-size: 0.8rem; text-decoration: line-through; margin-right: 5px; }

        .btn-card {
            width: 100%; padding: 10px;
            background: var(--green); color: white;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 1rem;
        }

        /* --- Product Viewer (Modal) --- */
        .viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: none; flex-direction: column;
            overflow-y: auto;
        }

        .viewer-header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            background: #111; border-bottom: 1px solid #333;
        }

        .viewer-body { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .main-view-box {
            width: 100%; max-width: 500px; height: 450px;
            border: 1px solid #333; border-radius: 10px;
            margin-bottom: 15px; overflow: hidden; position: relative;
        }

        .main-view-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }
        .zoomed { transform: scale(2.5); cursor: zoom-out; }

        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .ctrl-btn {
            background: #333; color: white; border: 1px solid #555;
            padding: 10px 25px; border-radius: 25px; cursor: pointer;
        }
        .ctrl-btn.active { border-color: var(--gold); color: var(--gold); }

        /* --- Order Form Modal --- */
        .form-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .form-box {
            background: #222; padding: 25px; border-radius: 15px;
            width: 90%; max-width: 400px; border: 1px solid var(--gold);
        }

        .inp-field {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: #111; border: 1px solid #444; color: white; border-radius: 8px;
        }

        .action-buttons {
            display: flex; gap: 10px; margin-top: 15px; flex-direction: column;
        }

        .btn-call {
            background: var(--blue);
            width: 100%; padding: 10px; color: white;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; font-size: 1rem;
        }
        
        .btn-cancel {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 5px;
        }

        /* --- Footer --- */
        footer {
            margin-top: 50px; padding: 30px; background: #000;
            text-align: center; border-top: 1px solid #333;
        }
        .credit { color: var(--gold); text-decoration: none; font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img" alt="Logo">
            <span class="brand-text">DISHA BRAND</span>
        </div>
        <a href="#collection" style="color: white; font-size: 1.4rem;"><i class="fas fa-shopping-bag"></i></a>
    </header>

    <section class="hero">
        <h1>STREETWEAR <br> <span style="color: var(--gold)">COLLECTION</span></h1>
        <p>أقوى كولكشن شتوي بأسعار زمان</p>
        <a href="#collection" class="btn-hero">تسوق الآن</a>
    </section>

    <section id="collection" class="container">
        <h2 class="section-title">الكولكشن الجديد</h2>
        <div class="grid" id="productsGrid">
            </div>
    </section>

    <div class="viewer-overlay" id="viewer">
        <div class="viewer-header">
            <h3 id="vName" style="color: var(--gold);">اسم المنتج</h3>
            <i class="fas fa-times" onclick="closeViewer()" style="font-size: 1.5rem; cursor: pointer; color: white;"></i>
        </div>
        <div class="viewer-body">
            <div class="main-view-box" onclick="toggleZoom()">
                <img src="" id="vImg" class="main-view-img">
            </div>
            <p style="color: #666; font-size: 0.8rem; margin-bottom: 10px;">اضغط على الصورة للتكبير</p>
            
            <div class="controls">
                <button class="ctrl-btn active" onclick="setSide('front')">الوش</button>
                <button class="ctrl-btn" onclick="setSide('back')">الضهر</button>
            </div>

            <h2 id="vPrice" style="color: var(--gold); margin-bottom: 20px;"></h2>

            <button class="btn-card" style="padding: 15px; font-size: 1.2rem;" onclick="openForm()">
                <i class="fas fa-shopping-cart"></i> تنفيذ الطلب
            </button>
        </div>
    </div>

    <div class="form-overlay" id="orderForm">
        <div class="form-box">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 15px;">إتمام الطلب</h3>
            <p style="color: #aaa; text-align: center; font-size: 0.9rem; margin-bottom: 15px;">أدخل بياناتك واختر طريقة الطلب</p>
            
            <input type="text" id="cName" class="inp-field" placeholder="الاسم بالكامل">
            <select id="cGov" class="inp-field" onchange="loadCities()">
                <option value="">اختر المحافظة...</option>
            </select>
            <select id="cCity" class="inp-field" disabled>
                <option value="">اختر المدينة...</option>
            </select>
            <input type="text" id="cAddress" class="inp-field" placeholder="العنوان بالتفصيل">
            
            <div class="action-buttons">
                <button class="btn-card" onclick="sendWhatsApp()">
                    <i class="fab fa-whatsapp"></i> طلب عبر واتساب
                </button>
                
                <a href="tel:01117943368" class="btn-call">
                    <i class="fas fa-phone"></i> اتصال مباشر
                </a>

                <button class="btn-cancel" onclick="closeForm()">إلغاء</button>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p>
        <p style="color: #555; margin-top: 10px;">
            Created by <a href="https://wa.me/201128381838" class="credit">Ahmed Mohamed</a>
        </p>
    </footer>

    <script>
        // --- أرقام التواصل ---
        const waPhone = "201284381589"; // رقم الواتساب للأوردرات
        const callPhone = "01117943368"; // رقم الاتصال

        // --- البيانات ---
        const products = [
            { id: 1, name: "هودي أسود (Black Skull)", price: 600, old: 750, front: "https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg", back: "https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg" },
            { id: 2, name: "هودي أوف وايت (Graphic)", price: 600, old: 750, front: "https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg", back: "https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg" },
            { id: 3, name: "هودي رصاصي طباعة", price: 600, old: 700, front: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg", back: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg" },
            { id: 4, name: "سويت شيرت بيسك (أسود)", price: 650, old: 800, front: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg", back: "https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg" },
            { id: 5, name: "سويت شيرت بيسك (رصاصي)", price: 650, old: 800, front: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg", back: "https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg" },
            { id: 6, name: "سويت شيرت بيسك (أوف وايت)", price: 650, old: 800, front: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg", back: "https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg" },
            { id: 7, name: "سويت شيرت بريميم (أسود)", price: 800, old: 1000, front: "https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg", back: "https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg" },
            { id: 8, name: "سويت شيرت بريميم (هافان)", price: 800, old: 1000, front: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg", back: "https://i.postimg.cc/tTT6R4VK/a39d6283e92042bbaa0871b553e9fbef.jpg" },
            { id: 9, name: "ترنج كامل (أسود)", price: 900, old: 1000, front: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg", back: "https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg" },
            { id: 10, name: "ترنج كامل (رصاصي)", price: 900, old: 1000, front: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg", back: "https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg" },
            { id: 11, name: "سويت شيرت هاي إند (أسود)", price: 1300, old: 1500, front: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg", back: "https://i.postimg.cc/bvdbpvbN/ff9b3cbaab694db8bcf404a4c3c63868.jpg" },
            { id: 12, name: "سويت شيرت هاي إند (بيج)", price: 1300, old: 1500, front: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg", back: "https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg" },
            { id: 13, name: "بنطلون كارجو/جينز", price: 700, old: 800, front: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg", back: "https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg" }
        ];

        const egyptData = {
            "القاهرة": ["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع الخامس", "شبرا", "وسط البلد", "حلوان", "المرج", "عين شمس"],
            "الجيزة": ["الدقي", "المهندسين", "الهرم", "فيصل", "6 أكتوبر", "الشيخ زايد", "إمبابة", "الوراق"],
            "الإسكندرية": ["سموحة", "ميامي", "المنتزه", "العجمي", "سيدي جابر", "محطة الرمل"],
            "القليوبية": ["بنها", "شبرا الخيمة", "قليوب", "العبور"],
            "الدقهلية": ["المنصورة", "ميت غمر"],
            "الشرقية": ["الزقازيق", "العشر من رمضان"],
            "الغربية": ["طنطا", "المحلة الكبرى"],
            "المنوفية": ["شبين الكوم", "السادات"],
            "البحيرة": ["دمنهور", "كفر الدوار"],
            "بورسعيد": ["بورسعيد", "بورفؤاد"],
            "السويس": ["السويس"],
            "الإسماعيلية": ["الإسماعيلية"],
            "كفر الشيخ": ["كفر الشيخ", "دسوق"],
            "دمياط": ["دمياط", "رأس البر"],
            "بني سويف": ["بني سويف"],
            "المنيا": ["المنيا"],
            "أسيوط": ["أسيوط"],
            "سوهاج": ["سوهاج"],
            "قنا": ["قنا"],
            "الأقصر": ["الأقصر"],
            "أسوان": ["أسوان"]
        };

        // --- Render Products ---
        const grid = document.getElementById('productsGrid');
        
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="badge">SALE</div>
                <div class="img-wrapper" onclick="openViewer(${p.id})">
                    <img src="${p.front}" class="product-img" alt="${p.name}">
                </div>
                <div class="info">
                    <div class="name">${p.name}</div>
                    <div class="price-box">
                        <span class="curr">${p.price} ج.م</span>
                        <span class="old">${p.old}</span>
                    </div>
                    <button class="btn-card" onclick="openViewer(${p.id})">
                        <i class="fas fa-eye"></i> عرض التفاصيل
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- Logic ---
        let currP = null;
        let isFront = true;

        function openViewer(id) {
            currP = products.find(p => p.id === id);
            document.getElementById('vName').innerText = currP.name;
            document.getElementById('vPrice').innerText = currP.price + " ج.م";
            document.getElementById('viewer').style.display = 'flex';
            setSide('front');
            document.getElementById('vImg').classList.remove('zoomed');
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
        }

        function setSide(side) {
            isFront = (side === 'front');
            document.getElementById('vImg').src = isFront ? currP.front : currP.back;
            const btns = document.querySelectorAll('.ctrl-btn');
            btns[0].classList.toggle('active', isFront);
            btns[1].classList.toggle('active', !isFront);
        }

        function toggleZoom() {
            document.getElementById('vImg').classList.toggle('zoomed');
        }

        function openForm() {
            closeViewer();
            document.getElementById('orderForm').style.display = 'flex';
            const govSel = document.getElementById('cGov');
            if(govSel.options.length === 1) {
                for(let g in egyptData) {
                    let opt = document.createElement('option');
                    opt.value = g; opt.innerText = g;
                    govSel.appendChild(opt);
                }
            }
        }

        function closeForm() {
            document.getElementById('orderForm').style.display = 'none';
        }

        function loadCities() {
            const gov = document.getElementById('cGov').value;
            const citySel = document.getElementById('cCity');
            citySel.innerHTML = '<option value="">اختر المدينة...</option>';
            if(gov && egyptData[gov]) {
                citySel.disabled = false;
                egyptData[gov].forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    citySel.appendChild(opt);
                });
            } else {
                citySel.disabled = true;
            }
        }

        function sendWhatsApp() {
            const name = document.getElementById('cName').value;
            const gov = document.getElementById('cGov').value;
            const city = document.getElementById('cCity').value;
            const addr = document.getElementById('cAddress').value;

            if(!name || !gov || !city || !addr) {
                alert('البيانات ناقصة يا ريس!');
                return;
            }

            const msg = `طلب جديد: ${currP.name}%0aالسعر: ${currP.price} جنيه%0a-- بيانات العميل --%0aالاسم: ${name}%0aالعنوان: ${gov} - ${city} - ${addr}`;
            window.open(`https://wa.me/${waPhone}?text=${msg}`, '_blank');
