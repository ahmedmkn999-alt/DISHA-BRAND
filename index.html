<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- الألوان (Dark & Gold Theme) --- */
        :root { --bg: #050505; --card-bg: #121212; --gold: #D4AF37; --gold-light: #F4CF57; --green: #25D366; --text: #fff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding-bottom: 60px; padding-top: 60px; overflow-x: hidden; }

        /* --- الهيدر --- */
        header { 
            background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--gold);
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; z-index: 99999;
            display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-img { height: 40px; border: 1px solid var(--gold); border-radius: 5px; }
        .brand-name { font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 1.2rem; font-weight: bold; }

        .nav-links { display: flex; gap: 5px; }
        .nav-btn {
            background: none; border: none; color: #bbb; font-weight: bold; font-size: 0.85rem;
            cursor: pointer; padding: 5px 10px; font-family: 'Cairo'; transition: 0.3s;
        }
        .nav-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* --- الصفحات --- */
        .page { display: none; width: 100%; animation: fadeIn 0.5s; min-height: 80vh; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- الفيديو (تم الإصلاح ليعمل كخلفية فقط) --- */
        .hero-container {
            position: relative; 
            height: 50vh; /* ارتفاع متوسط ومناسب */
            width: 100%; 
            overflow: hidden; 
            background: #000;
            border-bottom: 3px solid var(--gold);
        }
        
        .video-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* سحر الكود: بيمنع اللمس ع الفيديو عشان الزراير تشتغل */
            z-index: 0;
        }
        
        .video-wrapper iframe {
            width: 100vw; height: 56.25vw; 
            min-height: 100%; min-width: 100%;
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(1.3);
        }

        /* طبقة الكلام والزراير */
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); 
            z-index: 2;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .hero-overlay h1 { 
            color: white; font-family: 'Oswald'; font-size: 2.5rem; margin: 0; 
            text-shadow: 0 2px 10px black; pointer-events: none;
        }
        .hero-overlay h2 { 
            color: var(--gold); font-family: 'Oswald'; font-size: 1.5rem; margin: 0; 
            text-shadow: 0 2px 10px black; pointer-events: none;
        }
        
        /* زرار التسوق (تم التأكد من عمله) */
        .hero-btn {
            background: linear-gradient(45deg, var(--gold), var(--gold-light)); 
            border: none; padding: 12px 45px; 
            font-weight: 900; font-size: 1rem; color: black;
            border-radius: 50px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 0 15px rgba(212,175,55,0.6);
            z-index: 10; 
            pointer-events: auto; /* تفعيل اللمس للزرار */
        }

        /* --- الشبكة (Grid) --- */
        .sec-title { padding: 0 10px; margin: 20px 0 10px 0; border-right: 4px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .img-area { position: relative; padding-top: 125%; cursor: pointer; }
        .img-area img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; }
        
        .details { padding: 8px; text-align: center; }
        .p-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; color: #fff; }
        .price { color: var(--gold); font-weight: 900; font-size: 1rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-right: 5px; }
        .buy-btn { width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 6px; margin-top: 5px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        /* --- Footer --- */
        footer { background: #000; padding: 15px; text-align: center; border-top: 1px solid #333; margin-top: 30px; font-size: 0.8rem; color: #666; }
        footer span { color: var(--gold); }

        /* --- Modals --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; display: none; flex-direction: column; overflow-y: auto; }
        .modal-head { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .modal-content { padding: 15px; text-align: center; }
        .main-img { width: 100%; height: 400px; object-fit: contain; border: 1px solid #333; margin-bottom: 10px; border-radius: 5px; }
        .action-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .whatsapp { background: var(--green); color: white; }
        .call { background: #007bff; color: white; }
        .cancel { background: transparent; border: 1px solid #555; color: #ccc; }
        .inp { width: 100%; padding: 12px; background: #222; border: 1px solid #555; color: white; margin-bottom: 10px; border-radius: 5px; font-size: 0.9rem; text-align: right; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="window.goPage('home')">

    <div id="home" class="page active">

            </div>
            <div class="hero-overlay">

        </div>
        
        <div class="sec-title">الأكثر مبيعاً 🔥</div>

        <footer>
            <p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p>

    <div id="viewer" class="modal">
        <div class="modal-head">
            <h3 style="color: var(--gold); margin:0;" id="vName">اسم المنتج</h3>
            <button onclick="window.closeViewer()" style="background: none; border: none; color: white; font-size: 1.5rem;">✕</button>

            <div id="imgControls" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <button onclick="window.changeSide('f')" style="padding: 8px 25px; background: #222; color: white; border: 1px solid #444; border-radius: 20px;">الوش</button>
                <button onclick="window.changeSide('b')" style="padding: 8px 25px; background: #222; color: white; border: 1px solid #444; border-radius: 20px;">الضهر</button>

            <input type="text" id="cName" class="inp" placeholder="الاسم بالكامل">
            <select id="cGov" class="inp" onchange="window.loadCities()"><option value="">اختر المحافظة...</option></select>
            <select id="cCity" class="inp" disabled><option value="">اختر المدينة...</option></select>
            <input type="text" id="cAddr" class="inp" placeholder="العنوان بالتفصيل ورقم التليفون">
            <button class="action-btn whatsapp" onclick="window.sendWhatsapp()">تأكيد واتساب</button>
            <button class="action-btn call" onclick="window.open('tel:01117943368')">اتصال هاتفي</button>
            <button class="action-btn cancel" onclick="document.getElementById('orderForm').style.display='none'">إلغاء</button>

            // Graphic Hoodies
            {id:5, type:'top', name:'Hoodie Eye & Hand', price:600, old:750, f:'https://i.postimg.cc/HWQ7xW1L/1000012695.jpg', b:'https://i.postimg.cc/qRJ1zL9z/1000012696.jpg'},
            {id:6, type:'top', name:'Hoodie Angel Wings', price:600, old:750, f:'https://i.postimg.cc/Qd1n4yqR/1000012698.jpg', b:'https://i.postimg.cc/Prh5xWqL/1000012697.jpg'},
            {id:8, type:'top', name:'Hoodie Skull (Black)', price:600, old:750, f:'https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg', b:'https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'},
            {id:9, type:'top', name:'Hoodie Graphic (Off-White)', price:600, old:750, f:'https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg', b:'https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg'},
            {id:10, type:'top', name:'Hoodie Printed (Grey)', price:600, old:750, f:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg', b:'https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg'},
            // Basics
            {id:11, type:'top', name:'Sweatshirt Basic (Black)', price:650, old:800, f:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg', b:'https://i.postimg.cc/N0xFHvcb/ef64e6c8b8fe4c388e355eaf81ca510d.jpg'},
            {id:12, type:'top', name:'Sweatshirt Basic (Grey)', price:650, old:800, f:'https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg', b:'https://i.postimg.cc/0Q2QGXkf/c603bcbcda67413a83ebcffb745fd8d1.jpg'},
            {id:13, type:'top', name:'Sweatshirt Basic (White)', price:650, old:800, f:'https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg', b:'https://i.postimg.cc/ydYdhp1j/81b107ef7281417dad506780ee8cdd5d.jpg'},
            // Premium & Tracksuits
            {id:14, type:'top', name:'Premium Sweatshirt (Black)', price:800, old:1000, f:'https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg', b:'https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg'},
            {id:15, type:'top', name:'Premium Sweatshirt (Beige)', price:800, old:1000, f:'https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg', b:'https://i.postimg.cc/xdqHndH8/a31bad4a4c794a1ba0098a7fd72eb982.jpg'},
            {id:16, type:'top', name:'Tracksuit Full Set (Black)', price:900, old:1000, f:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg', b:'https://i.postimg.cc/TPhmfPmd/d42e2e329d3e4c049e3e0c887dce5463.jpg'},
            {id:17, type:'top', name:'Tracksuit Full Set (Grey)', price:900, old:1000, f:'https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg', b:'https://i.postimg.cc/pdy8Rd8d/eccd0f68a93241ed84eda8827c2bba92.jpg'},

            {id:19, type:'bottom', name:'Cargo Pants', price:700, old:800, f:'https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg', b:'https://i.postimg.cc/SK0qNTYx/69f03da0d15e42ce878cd7818fa0b75f.jpg'},

            {id:22, type:'bottom', name:'Jeans Mod 2', price:600, old:750, f:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg', b:'https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg'},

        ];

        let currentP = null;

        window.onload = function() {
            // تحميل المحافظات
            const govSel = document.getElementById('cGov');
            for (let gov in egyptGovs) {
                let opt = document.createElement('option');
                opt.value = gov; opt.innerText = gov;
                govSel.appendChild(opt);
            }

            // عرض المنتجات في الرئيسية
            window.render(products.filter(p => [1, 4, 16, 20].includes(p.id)), 'home-grid');
            
            // عرض الصفحات
            window.render(products.filter(p => p.type === 'top'), 'hoodies-grid');
            window.render(products.filter(p => p.type === 'bottom'), 'pants-grid');
        };

        window.loadCities = function() {
            const gov = document.getElementById('cGov').value;
            const citySel = document.getElementById('cCity');
            citySel.innerHTML = '<option value="">اختر المدينة...</option>';
            citySel.disabled = true;
            if (gov && egyptGovs[gov]) {
                citySel.disabled = false;
                egyptGovs[gov].forEach(city => {
                    let opt = document.createElement('option');
                    opt.value = city; opt.innerText = city;
                    citySel.appendChild(opt);
                });
            }
        }

        window.render = function(list, id) {
            const container = document.getElementById(id);
            if(!container) return;
            container.innerHTML = '';
            list.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <div class="badge">SALE</div>
                        <div class="img-area" onclick="window.openViewer(${p.id})">
                            <img src="${p.f}" loading="lazy">
                        </div>
                        <div class="details">
                            <div class="p-title">${p.name}</div>
                            <div><span class="price">${p.price} ج.م</span> <span class="old-price">${p.old}</span></div>
                            <button class="buy-btn" onclick="window.openViewer(${p.id})">التفاصيل</button>
                        </div>
                    </div>
                `;
            });
        }

        window.goPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        window.openViewer = function(id) {
            currentP = products.find(p => p.id === id);
            if(!currentP) return;
            document.getElementById('vName').innerText = currentP.name;
            document.getElementById('vPrice').innerText = currentP.price + " ج.م";
            document.getElementById('vImg').src = currentP.f;
