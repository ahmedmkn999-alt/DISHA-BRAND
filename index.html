<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISHA BRAND | ديشا براند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f0f0f; --card-bg: #1a1a1a; --gold: #D4AF37; --green: #25D366; --blue: #007bff; --text: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow-x: hidden; padding-bottom: 80px; padding-top: 70px; }

        /* Header & Nav */
        header { 
            background: rgba(15, 15, 15, 0.98); 
            padding: 0 10px; 
            position: fixed; top: 0; left: 0; width: 100%; 
            z-index: 9999; /* رقم عالي جداً عشان يفضل فوق */
            border-bottom: 1px solid #333;
            height: 70px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 45px; border-radius: 5px; border: 1px solid var(--gold); }
        .brand-name { font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 1.2rem; font-weight: bold; }

        /* Navigation Buttons - تحسين التاتش */
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { 
            background: none; border: none; 
            color: #aaa; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 1rem; 
            cursor: pointer; padding: 10px 5px; /* تكبير مساحة اللمس */
            transition: 0.3s; position: relative;
        }
        .nav-btn.active { color: var(--gold); }
        .nav-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--gold);
        }

        /* Pages */
        .page-section { display: none; padding-top: 10px; }
        .page-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Hero Section */
        .hero { 
            height: 50vh; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), var(--bg)), url('https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg'); 
            background-size: cover; background-position: center; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            margin-bottom: 20px;
        }
        .hero h1 { font-size: 2.5rem; font-weight: 900; color: white; text-transform: uppercase; font-family: 'Oswald', sans-serif; }
        .btn-main { padding: 10px 40px; background: var(--gold); color: black; font-weight: bold; border-radius: 30px; cursor: pointer; border: none; font-size: 1rem; margin-top: 10px; }

        /* Grid & Cards */
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .section-header { margin-bottom: 15px; border-right: 4px solid var(--gold); padding-right: 10px; display: flex; align-items: center; justify-content: space-between; }
        .sec-title { font-size: 1.3rem; font-weight: bold; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .img-box { position: relative; width: 100%; padding-top: 130%; overflow: hidden; }
        .prod-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #c00; color: white; padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: bold; }
        
        .info { padding: 10px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-name { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 900; font-size: 1rem; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-right: 5px; }
        
        .btn-view {
            width: 100%; padding: 8px; background: var(--green); color: white; border: none; 
            border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; overflow-y: auto; }
        .modal-header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .modal-body { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-img-box { width: 100%; max-width: 400px; height: 400px; border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .view-img { width: 100%; height: 100%; object-fit: contain; }
        .ctrl-btns { display: flex; gap: 15px; margin-bottom: 20px; }
        .sw-btn { background: #333; color: white; padding: 8px 25px; border-radius: 20px; border: 1px solid #555; cursor: pointer; }
        .sw-btn.active { border-color: var(--gold); color: var(--gold); }
        .big-btn { width: 100%; padding: 15px; background: var(--gold); color: black; border: none; font-weight: bold; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* Order Form */
        .form-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 11000; display: none; justify-content: center; align-items: center; }
        .form-content { background: #222; padding: 20px; width: 90%; max-width: 350px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; }
        .inp { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; }
        .btn-whatsapp { background: var(--green); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-call { background: var(--blue); color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; display: block; text-decoration: none; margin-bottom: 10px; }
        .btn-close { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; }

        footer { padding: 20px; text-align: center; background: #000; margin-top: 40px; border-top: 1px solid #333; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="showPage('home')">
            <img src="https://i.postimg.cc/Qd4nxHBK/IMG-20260210-192113.png" class="logo-img">
            <span class="brand-name">DISHA</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-home" onclick="showPage('home')">الرئيسية</button>
            <button class="nav-btn" id="btn-hoodies" onclick="showPage('hoodies')">هوديز</button>
            <button class="nav-btn" id="btn-pants" onclick="showPage('pants')">بناطيل</button>
        </div>
    </header>

    <div id="page-home" class="page-section active">
        <div class="hero">
            <h1>STREETWEAR <br> <span style="color:var(--gold)">2026</span></h1>
            <button class="btn-main" onclick="showPage('hoodies')">تسوق الآن</button>
        </div>

        <div class="container">
            <div class="section-header">
                <div class="sec-title">ترشيحات ديشا (Best Sellers) 🔥</div>
            </div>
            <div class="grid" id="homeGrid"></div>
        </div>
    </div>

    <div id="page-hoodies" class="page-section">
        <div class="container">
            <div class="section-header">
                <div class="sec-title">قسم الهوديز & سويت شيرت</div>
            </div>
            <div class="grid" id="hoodiesGrid"></div>
        </div>
    </div>

    <div id="page-pants" class="page-section">
        <div class="container">
            <div class="section-header">
                <div class="sec-title">قسم البناطيل & جينز</div>
            </div>
            <div class="grid" id="pantsGrid"></div>
        </div>
    </div>

    <div id="prodModal" class="modal">
        <div class="modal-header">
            <h3 style="color:var(--gold); margin:0;" id="mName">اسم المنتج</h3>
            <i class="fas fa-times" style="color:white; font-size:1.5rem; cursor:pointer;" onclick="closeModal()"></i>
        </div>
        <div class="modal-body">
            <div class="main-img-box">
                <img src="" id="mImg" class="view-img">
            </div>
            <div class="ctrl-btns">
                <button class="sw-btn active" id="btnFront" onclick="switchImg('front')">الوش</button>
                <button class="sw-btn" id="btnBack" onclick="switchImg('back')">الضهر</button>
            </div>
            <div style="text-align:center; margin-bottom:20px;">
                <span id="mPrice" style="color:var(--gold); font-size:1.5rem; font-weight:bold;">000</span>
                <span id="mOldPrice" style="color:#777; text-decoration:line-through; margin-right:10px;">000</span>
            </div>
            <button class="big-btn" onclick="openOrder()">تنفيذ الطلب</button>
        </div>
    </div>

    <div id="formModal" class="form-modal">
        <div class="form-content">
            <h3 style="color:var(--gold); margin-bottom:15px;">بيانات الشحن</h3>
            <input type="text" id="cName" class="inp" placeholder="الاسم بالكامل">
            <select id="cGov" class="inp" onchange="loadCities()">
                <option value="">اختر المحافظة...</option>
            </select>
            <select id="cCity" class="inp" disabled>
                <option value="">اختر المدينة...</option>
            </select>
            <input type="text" id="cAddr" class="inp" placeholder="العنوان بالتفصيل">
            <button class="btn-whatsapp" onclick="sendOrder('whatsapp')"><i class="fab fa-whatsapp"></i> طلب واتساب</button>
            <a href="tel:01117943368" class="btn-call"><i class="fas fa-phone"></i> اتصال هاتفي</a>
            <button class="btn-close" onclick="closeForm()">إلغاء</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 DISHA BRAND</p>
        <p style="color:#555; margin-top:5px;">Created by <a href="https://wa.me/201128381838" style="color:var(--gold); text-decoration:none;">Ahmed Mohamed</a></p>
    </footer>

    <script>
        // Data
        const products = [
            // --- الهوديز الجديدة (Best Sellers) ---
            { id: 20, type: 'top', name: "Zip-Up Hoodie (Preface Black)", price: 650, old: 800, f: "https://i.postimg.cc/k4vj4X8h/1000012700.jpg", b: "https://i.postimg.cc/k4vj4X8h/1000012700.jpg" },
            { id: 23, type: 'top', name: "Hoodie (Dope Shine White)", price: 600, old: 750, f: "https://i.postimg.cc/Xv0Xy5Qj/1000012716.jpg", b: "https://i.postimg.cc/GmR2gq4P/1000012717.jpg" },
            { id: 24, type: 'top', name: "Hoodie (Eye & Hand Black)", price: 600, old: 750, f: "https://i.postimg.cc/HWQ7xW1L/1000012695.jpg", b: "https://i.postimg.cc/qRJ1zL9z/1000012696.jpg" },
            // --- باقي الهوديز ---
            { id: 21, type: 'top', name: "Zip-Up Hoodie (Preface White)", price: 650, old: 800, f: "https://i.postimg.cc/7Zh0V1P2/1000012701.jpg", b: "https://i.postimg.cc/7Zh0V1P2/1000012701.jpg" },
            { id: 22, type: 'top', name: "Zip-Up Hoodie (Preface Brown)", price: 650, old: 800, f: "https://i.postimg.cc/CLj6bZzL/1000012702.jpg", b: "https://i.postimg.cc/CLj6bZzL/1000012702.jpg" },
            { id: 25, type: 'top', name: "Hoodie (Angel Wings White)", price: 600, old: 750, f: "https://i.postimg.cc/Qd1n4yqR/1000012698.jpg", b: "https://i.postimg.cc/Prh5xWqL/1000012697.jpg" },
            { id: 1, type: 'top', name: "هودي أسود (Black Skull)", price: 600, old: 750, f: "https://i.postimg.cc/5tmyCWVq/ddf7ab69bd3b4107acc21fe160cecc8e.jpg", b: "https://i.postimg.cc/jjh27Ybc/6e9c779330a243aa9726ab1264d436b7.jpg" },
            { id: 2, type: 'top', name: "هودي أوف وايت (Graphic)", price: 600, old: 750, f: "https://i.postimg.cc/MGYHQJSD/913fce38965c45a6a297f01e01ddd50b.jpg", b: "https://i.postimg.cc/25xyZND0/acbeec02f32e4d6eb68a1c323fed0dda.jpg" },
            { id: 3, type: 'top', name: "هودي رصاصي طباعة", price: 600, old: 700, f: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg", b: "https://i.postimg.cc/VNFvCP8W/f7892057f51040328974bff228367d1f.jpg" },
            { id: 7, type: 'top', name: "سويت شيرت بريميم (أسود)", price: 800, old: 1000, f: "https://i.postimg.cc/3w9pHvdY/fdf4556fed264436ad7d20d231c3c0ff.jpg", b: "https://i.postimg.cc/hjjm4t7H/b99d7c0aa746486eb9e54f8e1e309cef.jpg" },
            // --- البناطيل ---
            { id: 14, type: 'bottom', name: "بنطلون جينز (Light Blue)", price: 600, old: 750, f: "https://i.postimg.cc/zByvgp1V/IMG_20260210_WA0023.jpg", b: "https://i.postimg.cc/j5D27vrD/IMG-20260210-WA0022.jpg" },
            { id: 15, type: 'bottom', name: "بنطلون جينز بريميم (Mod 1)", price: 600, old: 750, f: "https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg", b: "https://i.postimg.cc/TPzMtcWZ/IMG_20260211_WA0000.jpg" },
            { id: 16, type: 'bottom', name: "بنطلون جينز بريميم (Mod 2)", price: 600, old: 750, f: "https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg", b: "https://i.postimg.cc/d0kcRfLP/IMG_20260211_WA0001.jpg" },
            { id: 17, type: 'bottom', name: "بنطلون جينز بريميم (Mod 3)", price: 600, old: 750, f: "https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg", b: "https://i.postimg.cc/8C2QZbr3/IMG_20260211_WA0002.jpg" },
            { id: 18, type: 'bottom', name: "بنطلون جينز بريميم (Mod 4)", price: 600, old: 750, f: "https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg", b: "https://i.postimg.cc/bv7cmR24/IMG_20260211_WA0003.jpg" },
            { id: 19, type: 'bottom', name: "بنطلون جينز بريميم (Mod 5)", price: 600, old: 750, f: "https://i.postimg.cc/XJb1Z15q/IMG_20260211_WA0004.jpg", b: "https://i.postimg.cc/Kz2pKpTR/IMG_20260211_WA0005.jpg" }
        ];

        const egyptData = { "القاهرة": [], "الجيزة": [], "الإسكندرية": [], "باقي المحافظات": [] };

        // --- Init ---
        function init() {
            // 1. الصفحة الرئيسية: اخترتلك 4 منتجات (هودي أسود، هودي أبيض، هودي رسمة، بنطلون)
            const homeList = [
                products.find(p => p.id === 20),
                products.find(p => p.id === 23),
                products.find(p => p.id === 24),
                products.find(p => p.id === 14)
            ];
            renderGrid(homeList, 'homeGrid');

            // 2. الهوديز
            const hoodies = products.filter(p => p.type === 'top');
            renderGrid(hoodies, 'hoodiesGrid');

            // 3. البناطيل
            const pants = products.filter(p => p.type === 'bottom');
            renderGrid(pants, 'pantsGrid');
        }

        function renderGrid(list, containerId) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="badge">SALE</div>
                        <div class="img-box" onclick="openViewer(${p.id})">
                            <img src="${p.f}" class="prod-img">
                        </div>
                        <div class="info">
                            <div class="p-name">${p.name}</div>
                            <div><span class="price">${p.price} ج.م</span> <span class="old-price">${p.old}</span></div>
                            <button class="btn-view" onclick="openViewer(${p.id})"><i class="fas fa-eye"></i> التفاصيل</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- Navigation Logic (Updated) ---
        function showPage(pageId) {
            // 1. Hide all pages
            const pages = document.querySelectorAll('.page-section');
            for(let i=0; i<pages.length; i++) {
                pages[i].style.display = 'none';
                pages[i].classList.remove('active');
            }
            
            // 2. Show selected page
            const target = document.getElementById('page-' + pageId);
            if(target) {
                target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 10);
            }

            // 3. Update buttons
            const btns = document.querySelectorAll('.nav-btn');
            for(let i=0; i<btns.length; i++) btns[i].classList.remove('active');
            document.getElementById('btn-' + pageId).classList.add('active');

            window.scrollTo(0, 0);
        }

        // --- Product Viewer ---
        let selectedProduct = null;
        let isFront = true;

        function openViewer(id) {
            selectedProduct = products.find(x => x.id == id);
            document.getElementById('mName').innerText = selectedProduct.name;
            document.getElementById('mPrice').innerText = selectedProduct.price + " ج.م";
            document.getElementById('mOldPrice').innerText = selectedProduct.old;
            isFront = true;
            updateImage();
            document.getElementById('prodModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('prodModal').style.display = 'none'; }

        function updateImage() {
            const img = document.getElementById('mImg');
            img.src = isFront ? selectedProduct.f : selectedProduct.b;
            document.getElementById('btnFront').classList.toggle('active', isFront);
            document.getElementById('btnBack').classList.toggle('active', !isFront);
        }

        function switchImg(side) { isFront = (side === 'front'); updateImage(); }

        // --- Order Logic ---
        function openOrder() {
            closeModal();
            document.getElementById('formModal').style.display = 'flex';
            const sel = document.getElementById('cGov');
            if (sel.options.length <= 1) {
                for (let g in egyptData) {
                    let opt = document.createElement('option');
                    opt.value = g; opt.innerText = g;
                    sel.appendChild(opt);
                }
            }
        }

        function closeForm() { document.getElementById('formModal').style.display = 'none'; }

        function loadCities() {
            const gov = document.getElementById('cGov').value;
            const citySel = document.getElementById('cCity');
            citySel.innerHTML = '<option value="">اختر المدينة...</option>';
            if(gov) citySel.disabled = false; 
            else citySel.disabled = true;
        }

        function sendOrder(type) {
            if (type === 'whatsapp') {
                const name = document.getElementById('cName').value;
                const gov = document.getElementById('cGov').value;
